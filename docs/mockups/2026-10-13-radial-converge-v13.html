    const g = G; G = null;
    clearTimeout(g.timer); g.btn.classList.remove('charging');
    if (!g.opened) return tapAction(g.post, g.t0, g.source === 'key' ? '鍵盤點按' : '點擊');
    const offX = W ? W.cx - g.ox : 0, offY = W ? W.cy - g.oy : 0;
    if ((offX === 0 && offY === 0) || g.mode === 'flick') {   // F01: the normal path and every flick are exactly v8.
      if (W && W.sel >= 0) return commit(W.sel, g.mode, g.t0);
      if (g.source === 'pointer' && W && Math.hypot(x - g.ox, y - g.oy) < geom.dead) {
        W.sticky = true; wheel.classList.add('sticky'); centerText(-1, -1);
        return;
      }
      closeWheel('cancel');
      return;
    }
    // F01: clamped hold / S. A selected sector commits; otherwise a release near the press point or the
    // drawn centre goes sticky, as v8 does for a press-and-release without moving.
    if (W && W.sel >= 0) return commit(W.sel, g.mode, g.t0);
    if (g.source === 'pointer' && W && (Math.hypot(x - g.ox, y - g.oy) < geom.dead || Math.hypot(x - W.cx, y - W.cy) < geom.dead)) {
      W.sticky = true; wheel.classList.add('sticky'); centerText(-1, -1);
      return;
    }
    closeWheel('cancel');
  }
  function cancelGesture() {
    if (!G) return;
    const g = G; G = null;
    clearTimeout(g.timer); g.btn.classList.remove('charging');
    if (g.opened) closeWheel('cancel');
  }

  function tapAction(post, t0, label) {
    if (saved.has(post.id)) {
      const prev = saved.get(post.id), prevL = lensOf.get(post.id), prevTopic=topicOf.get(post.id);
      unsave(post);
      const version = mutations.get(post.id);
      toast(`已從「<b>${WS[prev].name}</b>」移除`, [{ label: '復原', fn: () => { hideToast(); if (mutations.get(post.id) === version) save(post, prev, prevL, { quiet: true, topicId:prevTopic }); } }]);
      readout(label, t0, '移除');
      return;
    }
    save(post, lastWs, DEFAULT_LENS[lastWs]);
    readout(label, t0, WS[lastWs].name);
  }

  const MODE_LABEL = { hold: '按住', flick: '快甩', key: '鍵盤', sticky: '點選', num: '快捷鍵' };
  function commit(idx, mode, t0) {
    if (!W || W.locked) return;
    W.locked = true;
    const t = TARGETS[idx], post = W.post, btn = W.btn;
    sectorEls[idx].classList.add('picked'); labelEls[idx].classList.add('picked');
    blip(880, 0.07, 0.04, 'triangle');
    const k = K(), pulse = cfg.rm ? 0 : 90 * k, land = cfg.rm ? 0 : (90 + 210) * k;
    const ws = t.ws, L = DEFAULT_LENS[ws];
    lastWs = ws;
    save(post, ws, L, { popDelay: land, topicId: W.topicId });   // saved on release; the fly-in is decoration that follows
    setTimeout(() => closeWheel('commit', btn), pulse);
    readout(MODE_LABEL[mode] || mode, t0, tName(t));
  }

  // ---------- saving ----------
  function save(post, ws, L, opts = {}) {
    const id = post.id, prev = saved.get(id);
    mutatePost(id); expandedCards.delete(id); opened.delete(id); savedAtReal.set(id,performance.now());
    linePick.delete(id);
    if(ws==='topic') { if(opts.topicId==='__more') { topicOf.delete(id); linePick.add(id); } else if(opts.topicId) assignTopic(id,opts.topicId,false); else topicOf.delete(id); } else topicOf.delete(id);
    if (ws !== 'pr') { prOrder.delete(id); prState.delete(id); }
    else if (!prOrder.has(id)) prOrder.set(id, true);
    if (prev && WS[prev]) WS[prev].count--;
    saved.set(id, ws); WS[ws].count++; lensOf.set(id, L); collapsed.delete(id);
    const btn = btnOf(post), color = WS[ws].color;
    btn.style.setProperty('--acc', color);
    btn.classList.add('saved'); btn.classList.remove('ready');
    const pop = () => { btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); blip(523, 0.05, 0.035); setTimeout(() => blip(784, 0.08, 0.03), 55); };
    if (opts.popDelay) setTimeout(pop, opts.popDelay); else pop();
    const chip = elOf(post).querySelector('.dl-chip');
    chip.hidden = false; chip.style.setProperty('--acc', color); chip.textContent = '✓ ' + WS[ws].name;
    chip.style.animation = 'none'; void chip.offsetWidth; chip.style.animation = '';
    if (READS_WS.has(ws)) startReading(post, L); else jobs.delete(id);
    if (ws === 'pr' && cfg.campaign) startPr(post);
    schedule();
    renderSlot(post, true); renderOrb();
    refreshCounts(); renderPrCards(id);
  }

  function unsave(post) {
    const id = post.id, prev = saved.get(id);
    if (!prev) return;
    mutatePost(id); prOrder.delete(id); prState.delete(id);
    topicOf.delete(id); expandedCards.delete(id); opened.delete(id); returnGlow.delete(id); recentDone=recentDone.filter(x=>x.id!==id);
    WS[prev].count--; saved.delete(id); lensOf.delete(id); jobs.delete(id); unseen.delete(id);
    btnOf(post).classList.remove('saved', 'pop', 'busy', 'queued', 'ready', 'failed');
    elOf(post).querySelector('.dl-chip').hidden = true;
    if (expFor === id) closeExp();
    schedule(); renderSlot(post); renderOrb(); refreshCounts(); renderPrCards(id);
  }

  // ---------- crawl + read pipeline (simulated clock) ----------
  // One simulated backend worker. Durations drive fixtures only, never a predicted finish time.
  const estOf = (post) => Math.round(55 + Math.min(post.comments, 500) * 0.22);
  const planOf = (post) => post.plan ?? [{ sec: post.crawlSec, ok: true }];
  const LIVE = new Set(['queued', 'crawling', 'reading']);
  const ERR_TEXT = { unexpected_runtime_error: '頁面載入異常', max_attempts_exceeded: '已達重試上限' };
  const STATE_TEXT = { queued: '排隊中', crawling: '抓取中', reading: 'AI 整理中', done: '完成', failed: '抓取失敗' };

  function newJob(post, plan) {
    return { id: post.id, seq: ++seq, plan: plan ?? planOf(post), attempt: 0, spent: 0, est: estOf(post),
      readSec: 9 + Math.round(post.got / 80), state: 'queued', tQueue: simT, tStart: 0, tRead: 0, err: '' };
  }
  function startReading(post, L) {
    const id = post.id, j = jobs.get(id);
    if (crawled.has(id)) {
      const job = j ?? newJob(post);
      if (readCache.has(readKey(id)) || !post.got || post.comments < MIN_COMMENTS || !cfg.ai) job.state = 'done';   // no AI key: crawl results are the answer
      else { job.state = 'reading'; job.tRead = simT; job.readSec = 5 + Math.round(post.got / 150); }
      jobs.set(id, job);
      return;
    }
    if (j && (LIVE.has(j.state))) return;          // already on its way; the new lens just changes the final reading
    jobs.set(id, newJob(post));
  }
  function schedule() {
    let free = cfg.parallel - [...jobs.values()].filter((j) => j.state === 'crawling').length;
    const queued = [...jobs.values()].filter((j) => j.state === 'queued').sort((a, b) => a.seq - b.seq);
    for (const j of queued) {
      if (free <= 0) break;
      free--; j.state = 'crawling'; j.tStart = simT; renderSlot(postById(j.id));
    }
  }

  const fmt = (sec) => { const s = Math.ceil(sec); return s < 60 ? `${s} 秒` : `${Math.floor(s / 60)} 分 ${String(s % 60).padStart(2, '0')} 秒`; };
  const elapsedText = (j) => {
    const start = j.state === 'reading' ? j.tRead : j.state === 'queued' ? j.tQueue : j.tStart;
    const s = Math.max(0, Math.floor(simT - start));
    return `已等 ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };

  function syncBtn(post) {
    const j = jobs.get(post.id), btn = btnOf(post), ws = saved.get(post.id);
    btn.setAttribute('aria-label', ws ? `已在〈${WS[ws].name}〉· 按一下移除` : '收藏到 DLens');
    btn.setAttribute('aria-pressed', String(!!ws));
    btn.classList.toggle('busy', !!j && LIVE.has(j.state));
    btn.classList.toggle('queued', !!j && j.state === 'queued');
    btn.classList.toggle('failed', !!j && j.state === 'failed');
    btn.classList.toggle('ready',!!j && j.state==='done' && !opened.has(post.id));
  }

  const visible = (post) => { const r = elOf(post).getBoundingClientRect(); return r.top < innerHeight * 0.85 && r.bottom > 60; };
  function notify(j) {
    const post = postById(j.id), btn = btnOf(post);
    if (j.state === 'done') { btn.classList.add('ready'); blip(660, 0.06, 0.03); setTimeout(() => blip(990, 0.09, 0.025), 70); }
    else blip(330, 0.12, 0.03, 'triangle');
    if(j.state==='done') {recordDone(j.id);if(panelState.reader===j.id){markOpened(j.id);renderSP();}}
    if (!visible(post)) { unseen.add(j.id); if(j.state==='done')returnGlow.add(j.id); }
    // Results arrive on the orb, never as a toast: the feed keeps scrolling undisturbed.
    orb.classList.remove('bump'); void orb.offsetWidth; orb.classList.add('bump');
    renderOrb();
  }

  function tick() {
    const now = performance.now();
    simT += (now - lastReal) / 1000 * cfg.timeScale; lastReal = now;
    for (const j of [...jobs.values()]) {
      const post = postById(j.id);
      if (j.state === 'crawling') {
        const step = j.plan[j.attempt];
        if (simT - j.tStart < step.sec) continue;
        j.spent += step.sec;
        if (step.ok) {
          crawled.add(j.id);
          if (post.got >= MIN_COMMENTS && cfg.ai) { j.state = 'reading'; j.tRead = simT; renderSlot(post, false, true); }
          else { j.state = 'done'; renderSlot(post, false, true); notify(j); }
        } else if (j.attempt < j.plan.length - 1) {
          j.attempt++; j.tStart = simT; j.err = step.err; renderSlot(post);
        } else {
          j.state = 'failed'; j.err = step.err; renderSlot(post); notify(j);
        }
        schedule(); renderOrb();
      } else if (j.state === 'reading' && simT - j.tRead >= j.readSec) {
        j.state = 'done'; if (cfg.ai) readCache.add(readKey(j.id));
        renderSlot(post, false, true); notify(j);
      }
    }
    $$('[data-elapsed]').forEach((el) => { const j = jobs.get(el.dataset.elapsed); if (j && LIVE.has(j.state)) el.textContent = elapsedText(j); });
    for(const p of POSTS) if(saved.get(p.id)==='topic' && LIVE.has(jobs.get(p.id)?.state) && !expandedCards.has(p.id)) renderCompact(p);
    drawOrbRing();
    const t = Math.floor(simT);
    $('#clock').textContent = `模擬時鐘 +${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')} · ${cfg.timeScale === 1 ? '真實速度' : cfg.timeScale + '× 加速'}`;
  }
  setInterval(tick, 100);

  // ---------- slot under the post ----------
  // Shared: the card shell, the status line, collapse, and evidence on 展開. Each workspace decides what its card leads with.
  // Budget per answer: percentages only where quant has them; ordered methods or two claims with single-line quotes. Everything else is in 展開證據.
  const TIER = ['即時', '之後', '抓取後', 'AI'];
  const tt = (t) => `<span class="tt t${t}">${TIER[t]}</span>`;
  const fmtN = (n) => (n >= 1000 ? `${(n / 1000).toFixed(1).replace(/\.0$/, '')}K` : String(n));
  const cite = (q, extra) => `<cite>@${esc(q[1])} · ${esc(q[2])} 讚${extra ? ' · ' + extra : ''}</cite>`;
  const countLabel = (post) => `<span class="num">${post.got}</span> / <span class="num">${showCount(post)}</span> 則`;
  const q1 = (q, extra) => `<div class="q1"><q>「${esc(q[0])}」</q><cite>@${esc(q[1])} · ${esc(q[2])} 讚${extra ? ' · ' + extra : ''}</cite></div>`;
  const evQuote = (q, extra) => `<div class="ev"><q>「${esc(q[0])}」</q>${cite(q, extra)}</div>`;
  const phRow = (post, [ph, lb, n], i) => `<button class="ph-row" data-id="${post.id}" data-i="${i}"><span class="ph">${esc(ph)}</span><span class="lb">${n} 則留言提到呢句</span><span class="ct"></span></button>`;
  const mainShape = (post) => [...post.shapes].sort((a, b) => b[1] - a[1])[0];
  const clusterName = (post, sh) => (cfg.ai ? sh[0] : KW[post.id][post.shapes.indexOf(sh)]);
  const prState = new Map();   // postId -> 'lit' | 'run' | 'ai'
  const notes = new Map();     // postId -> note text (收藏整理)
  const noteEditing = new Set();
  const shownQ = new Map();    // postId -> quotes already on the card, so 展開證據 never repeats them

  // Every reply the fixture knows about, most-liked first. Real source: crawl comments sorted by like_count.
  function quotesOf(post) {
    const all = [...(post.shapes || []).map((s) => s[3]), ...(post.more || []), ...(post.methods || []).map((m) => m[3]),
      ...((post.split && post.split.sides) || []).map((x) => x[3])].filter(Boolean);
    const seen = new Set();
    return all.filter((q) => !seen.has(q[0]) && seen.add(q[0])).sort((a, b) => likeN(b[2]) - likeN(a[2]));
  }
  // Replies whose author is the post's author. Real source: reply edges where reply author = root author.
  const opReplies = (post) => (post.ask || []).filter((x) => x[2] === 'a').map(([q, , , ans]) => [q, ans.replace(/^作者：/, '')]);

  function cappedNote(post) {
    return post.capped ? `<p class="note">只抓到前 ${post.got} / ${showCount(post)} 則（${Math.round(post.got / likeN(showCount(post)) * 100)}%），以下只代表這個樣本。</p>` : '';
  }
  function entries(post, list, L, fn) {
    return `<div class="entries" role="tablist" style="--n:${list.length}">${list.map(({ key, q }) => {
      const [f, mark, tier] = fn(post, key);
      const [c, icon] = EN[key];
      return `<button class="entry${key === L ? ' on' : ''}" style="--ec:${c}" role="tab" aria-selected="${key === L}" aria-expanded="${key === L}" data-lens="${key}" data-id="${post.id}"><span class="q">${tier != null ? tt(tier) : ''}<span class="ei">${icon}</span>${q}</span><span class="f">${mark ? `<em>${mark}</em>` : ''}${esc(f)}</span></button>`;
    }).join('')}</div>`;
  }

  // ----- 觀眾反應: the audience's reaction leads; every entry already states one -----
  const topicSet = () => (cfg.ai ? TOPIC : TOPIC_RAW);
  function topicEntry(post, key) {
    if (key === 'stance') { const m = mainShape(post); return [cfg.ai ? post.find.stance : clusterName(post, m), `${m[1]}%`, cfg.ai ? 3 : 2]; }
    if (key === 'method') return [post.find.method, post.methods.length ? `${post.methods.length} 種` : '', 3];
    if (key === 'split') return [post.find.split, post.split.sides ? `${post.split.sides.length} 邊` : '', 3];
    if (key === 'top') { const q = quotesOf(post)[0]; return [q[0], `${q[2]} 讚`, 2]; }
    if (key === 'op') { const ops = opReplies(post); return [ops.length ? ops[0][1] : '樣本內未見作者回覆', ops.length ? `${ops.length} 則` : '', 2]; }
    const open = post.ask.filter((x) => !x[2]), first = open[0] || post.ask[0];
    return [cfg.ai ? post.find.ask : first ? first[0] : '未見提問', post.ask.length ? (open.length ? `${open.length} 未回` : '都有回覆') : '', cfg.ai ? 3 : 2];
  }
  function topicAnswer(post, L) {
    const shown = [];
    const one = (q, extra) => { shown.push(q[0]); return q1(q, extra); };
    let html = '';
    if (L === 'stance') {
      const order = [...post.shapes].sort((a, b) => b[1] - a[1]), m = order[0];
      const lead = cfg.ai ? post.gist : `最大一群講「${clusterName(post, m)}」，佔已讀留言 ${m[1]}%。`;
      html = `<p class="headline">${tt(cfg.ai ? 3 : 2)}${esc(lead)}</p>
        <div class="stack">${order.map((sh) => `<i style="--w:${sh[1]};--c:${sh[2]}"></i>`).join('')}</div>
        <div class="legend">${order.map((sh) => `<span style="--c:${sh[2]}"><b>${esc(clusterName(post, sh))}</b><em>${sh[1]}%</em></span>`).join('')}</div>
        ${one(m[3])}`;
    } else if (L === 'method') {
      if (!post.methods.length) html = `<p class="headline">${tt(3)}留言多是推薦和意見，未見可以照做的方法。</p>`;
      else {
        html = `<div class="bars">${post.methods.map(([a], i) => `<div class="bar-row${i === 0 ? ' main' : ''}" style="grid-template-columns:minmax(0,1fr)"><span>${i === 0 ? tt(3) : ''}${esc(a)}</span></div>`).join('')}</div>
          ${one(post.methods[0][3])}`;
      }
    } else if (L === 'split') {
      const sp = post.split;
      if (!sp.sides) html = `<p class="headline">${tt(3)}${esc(sp.agree)}</p><p class="note">只根據已讀的 ${post.got} 則留言。</p>`;
      else {
        html = sp.sides.map(([claim, why, , quote], i) => `<div${i ? ' style="margin-top:14px"' : ''}><p class="ctx">${i === 0 ? tt(3) : ''}<b>${esc(claim)}</b> · ${esc(why)}</p>${one(quote)}</div>`).join('');
      }
    } else if (L === 'top') {
      const qs = quotesOf(post).slice(0, 3);
      qs.forEach((q) => shown.push(q[0]));
      html = `<div class="bars">${qs.map((q) => `<div class="top-row"><span class="n">${esc(q[2])} 讚</span><q>「${esc(q[0])}」<small>@${esc(q[1])}</small></q></div>`).join('')}</div>`;
    } else if (L === 'op') {
      const ops = opReplies(post);
      html = ops.length
        ? `<div class="bars">${ops.map(([q, ans]) => `<div class="qrow"><span class="qd a"></span><span>${esc(ans)}</span><span class="n">答「${esc(q)}」</span></div>`).join('')}</div>`
        : `<p class="headline">${tt(2)}樣本內未見作者回覆。</p>`;
    } else if (L === 'ask') {
      if (!post.ask.length) html = `<p class="headline">${tt(2)}留言裡未見提問。</p>`;
      else {
        const qs = [...post.ask].sort((a, b) => (a[2] ? 1 : 0) - (b[2] ? 1 : 0) || b[1] - a[1]);   // unanswered first
        const open = qs.filter((x) => !x[2]).length;
        // Without AI we only know that someone replied, not that the reply answers the question.
        const LAB = { a: '作者回覆', o: '有人回覆', '': '樣本內未見回覆' };
        html = `<p class="headline">${tt(cfg.ai ? 3 : 2)}${open ? `部分問題${LAB['']}` : '樣本內的問題有人回覆'}</p>
          <div class="bars">${qs.map(([q, n, a]) => `<div class="qrow"><span class="qd ${a || 'n'}"></span><span>${esc(q)}</span><span class="n">${a ? '' : `<button class="go" data-answer="${post.id}">回答 ↗</button>`}</span></div>`).join('')}</div>
          <div class="qkey">${['a', 'o', ''].filter((k) => qs.some((x) => x[2] === k)).map((k) => `<span><i class="qd ${k || 'n'}"></i>${LAB[k]}</span>`).join('')}</div>`;
      }
    }
    shownQ.set(post.id, new Set(shown));
    return html;
  }

  // ----- 個人應用: what it means for my product leads -----
  const VERDICT = { try: '值得試', watch: '先留意', low: '關聯低', thin: '資料不足' };
  function productEntry(post, key) {
    const p = post.prod;
    if (key === 'rel') return [`對應：${p.goal}`, '', 3];
    if (key === 'try') return [p.stepShort, '', 3];
    return [`${p.support.length} 句支持 · ${p.limits.length} 項未驗證`, '', 3];
  }
  function productAnswer(post, L) {
    const p = post.prod;
    if (L === 'rel') return `<p class="headline">對應你的目標：${esc(p.goal)}</p><p class="ctx" style="margin-top:4px">${esc(p.rel)}</p><p class="note">按產品資料：${PROFILE.name}（${PROFILE.category} · ${PROFILE.audience}）</p>`;
    if (L === 'try') return `<p class="headline">${esc(p.step)}</p><div class="sub-k"><span>需要</span></div><p class="ctx">${esc(p.need)}</p><div class="acts"><button class="btn" data-trylist="${post.id}" aria-pressed="${tryMarks.has(post.id)}">${tryMarks.has(post.id) ? '已標記想試' : '標記想試'}</button></div>`;
    return `<div class="sub-k" style="margin-top:0"><span>支持的原句</span><span>${p.support.length} 句</span></div>${p.support.map((q) => evQuote(q)).join('')}
      <div class="sub-k"><span>未驗證、要留意</span><span>${p.limits.length} 項</span></div><ul class="lim">${p.limits.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
  }
  function productBody(post, L) {
    if (!cfg.ai) {
      return `<div style="margin-top:8px"><p class="headline">${tt(3)}個人應用要 AI 先判斷到</p><p class="ctx">要用你自己的 API key，對照「${PROFILE.name}」的產品資料。冇 key 時呢篇照樣保存，留言可以放去觀眾反應睇。</p>
        <div class="acts"><button class="btn primary" data-key>填 API key</button><button class="btn" data-move="${post.id}">改放其他工作區</button></div></div>`;
    }
    if (!cfg.profile) {
      return `<div style="margin-top:10px"><p class="headline">個人應用要先知道你在做甚麼</p><p class="ctx">之後每篇收藏都會按你的目標判斷：值得試、先留意，還是關聯低。</p>
        <div class="acts"><button class="btn primary" data-profile>我的產品</button><button class="btn" data-profile>我的生意</button><button class="btn" data-profile>我的工作</button></div></div>`;
    }
    const p = post.prod;
    const verdict = `<div class="verdict"><span class="vchip ${p.v}">${VERDICT[p.v]}</span><p class="headline">${esc(p.reason)}</p></div>`;
    if (p.v === 'low' || p.v === 'thin') return `${verdict}<div class="foot"><button class="ln" data-move="${post.id}">改放其他工作區</button></div>`;
    return `${verdict}${entries(post, PRODUCT, L, productEntry)}${L ? `<div class="answer" style="--acc:${EN[L][0]}">${productAnswer(post, L)}</div>` : ''}`;
  }

  function foot(post) {
    return `<div class="foot"><button class="ln open${expFor === post.id ? ' on' : ''}" data-open="${post.id}">展開證據 ↗</button></div>`;
  }
  function doneBody(post, ws, L) {
    if (ws === 'product') return productBody(post, L);
    if (!post.got) return `<p class="gist">還沒有留言。</p><div class="acts"><button class="btn" data-later="${post.id}">1 小時後再抓</button></div>`;
    if (post.comments < MIN_COMMENTS) {
      return `<p class="note" style="margin-top:8px">只有 ${post.got} 則留言，未夠歸納，全部列出：</p>
        ${post.few.map((q) => `<div class="reply">${esc(q[0])}${cite(q)}</div>`).join('')}`;
    }
    return `${cappedNote(post)}${frameLink(post)}${entries(post, topicSet(), L, topicEntry)}${L ? `<div class="answer" style="--acc:${EN[L][0]}">${topicAnswer(post, L)}</div>` : ''}${foot(post)}`;
  }

  // ----- 活動追蹤: campaign messages against the post text, plus the engagement record; no replies, no sentiment -----
  // The literal check is free and instant, so it runs on save. AI is an optional second pass for reworded lines.
  // F10: keyword matching against the caption only; no post-id lookup for literal matches.
  const normalizeMatchText = (s) => s.toLowerCase().replace(/\s+/g, '');
  function criterionKeywords(label) {
    if (/名稱/.test(label)) return [CAMPAIGN.name];
    if (/連結|網址/.test(label)) return []; // URLs are matched as exact caption substrings below.
    const text = label.replace(/^(?:提及|包含|附上|附)/, '').trim();
    return text.match(/#[\p{L}\p{N}_-]+|[\p{L}\p{N}_+]{3,}/gu) || [text];
  }
  function literalPrHits(post) {
    const hits = {};
    for (const [id, label] of CAMPAIGN.criteria) {
      const words = /連結|網址/.test(label)
        ? (post.text.match(/(?:https?:\/\/)?[a-z0-9-]+(?:\.[a-z0-9-]+)+(?:\/[^\s，。；！？]*)?/gi) || [])
        : criterionKeywords(label);
      // Keep the matched caption span, including its original spacing/case, for hover.
      for (const word of words) {
        const chars = [...word].filter((c) => !/\s/.test(c));
        if (!chars.length || !normalizeMatchText(post.text).includes(normalizeMatchText(word))) continue;
        const pattern = chars.map((c) => c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s*');
        const match = post.text.match(new RegExp(pattern, 'i'));
        if (match) { hits[id] = match[0]; break; }
      }
    }
    return hits;
  }
  // Simulated AI result, restricted to the demo criterion and captured rewording.
  function aiPrHits(post) {
    const quote = '冇工作經驗嘅應屆生都歡迎申請';
    return Object.fromEntries(CAMPAIGN.criteria.filter(([id, label]) => label === '歡迎無經驗畢業生' && post.text.includes(quote) && !literalPrHits(post)[id]).map(([id]) => [id, quote]));
  }
  const prHits = (post) => ({ ...literalPrHits(post), ...(prState.get(post.id) === 'ai' ? aiPrHits(post) : {}) });
  function campaignRows() {
    return [...campaignPrior, ...[...prOrder.keys()].filter((id) => saved.get(id) === 'pr').map((id) => ({ id, checked: prState.has(id), hits: prHits(postById(id)) }))];
  }
  function renderPrCards(except) { POSTS.forEach((p) => { if (p.id !== except && saved.get(p.id) === 'pr') renderSlot(p); }); }
  const prSetup = new Map();   // postId -> 'form' | 'criteria' while no campaign exists
  const prViews = new Map();   // postId -> 'loading' | 'ok'
  const campaignDrafts = new Map();
  const prAt = new Map();      // postId -> time the numbers were recorded
  function recordPr(post) {
    const d = new Date(), token = Symbol('metrics');
    metricsRequests.set(post.id, token);
    prAt.set(post.id, `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`);
    prViews.set(post.id, 'loading');
    setTimeout(() => { if (metricsRequests.get(post.id) !== token || saved.get(post.id) !== 'pr') return; metricsRequests.delete(post.id); prViews.set(post.id, 'ok'); renderSlot(post); }, cfg.rm ? 300 : 2200);
  }
  function startPr(post) { prState.set(post.id, 'lit'); recordPr(post); }

  function prCard(post, head) {
    if (!cfg.campaign) return prSetupCard(post, head);
    const st = prState.get(post.id) || 'lit', ai = st === 'ai' ? aiPrHits(post) : {}, nAi = Object.keys(ai).length;
    const hits = prHits(post), n = Object.keys(hits).length, total = CAMPAIGN.criteria.length, rows = campaignRows(), ordinal = rows.findIndex((r) => r.id === post.id) + 1;
    const chips = CAMPAIGN.criteria.map(([c, label]) => `<span class="crit${hits[c] ? ' hit' : ''}" data-c="${c}" data-id="${post.id}">${hits[c] ? '✓ ' : ''}${esc(label)}${ai[c] && !literalPrHits(post)[c] ? '<small>AI 認出改寫</small>' : ''}</span>`).join('');
    const check = st === 'run' ? '<div class="sk"><i></i><i></i></div>'
      : `<p class="headline" style="margin-top:8px">${tt(st === 'ai' ? 3 : 0)}${n ? `符合 ${n} / ${total} 項` : '這篇沒有帶出活動訊息'}<span class="via">${st === 'ai' ? (nAi ? `AI 多認出 ${nAi} 項` : 'AI 冇新增') : '字面對照'}</span></p><div class="crits">${chips}</div>`;
    // F09: recompute from prior records plus current memberships; unchecked rows are not misses.
    const checked = rows.filter((r) => r.checked);
    const [gapLabel, gapN] = CAMPAIGN.criteria.map(([c, label]) => [label, checked.filter((r) => !r.hits[c]).length]).sort((a, b) => b[1] - a[1])[0] || ['', 0];
    const gap = checked.length && gapN >= Math.ceil(checked.length / 2) ? `<p class="pr-gap">${tt(0)}活動內 ${rows.length} 篇，已核對 ${checked.length} 篇：「${esc(gapLabel)}」<b>${gapN} 篇未提</b></p>` : '';
    const views = prViews.get(post.id) === 'ok' ? (VIEWS[post.id] ? `瀏覽 <b>${VIEWS[post.id]}</b>` : '瀏覽未取得') : '瀏覽取得中…';
    const rec = `<div class="pr-rec">${tt(0)}互動數字已記錄 ${prAt.get(post.id) || ''} · ${tt(2)}${views}<button class="ln" data-refresh="${post.id}">更新數字</button></div>`;
    const aiBtn = st !== 'lit' ? '' : cfg.ai ? `<button class="ln" data-check="${post.id}">AI 再對一次</button>` : '<span class="lab">未接 AI，只做字面對照</span>';
    return [head(`· 〈${esc(CAMPAIGN.name)}〉· 第 ${ordinal} 篇`) + check + gap + rec +
      `<div class="foot">${aiBtn}<button class="ln" data-csv>匯出 CSV</button><button class="ln open" data-open-camp>開啟活動 ↗</button></div>`, ''];
  }
  // No campaign yet: the card sets one up from a brief, in place. Candidates are literal clauses from the brief, confirmed by the user.
  function prSetupCard(post, head) {
    const step = prSetup.get(post.id), h = head('· 未有活動', 'idle'), draft = campaignDrafts.get(post.id) || DEMO_BRIEF;
    if (step === 'form') return [h + `<div class="pr-form"><label>活動名稱<input data-camp-name value="${esc(draft.name)}"></label>
      <label>活動 brief（新聞稿、KOL brief 都得）<textarea data-camp-brief rows="3">${esc(draft.text)}</textarea></label>
      <p class="note">規則：取「重點：」後，按「；」或「。」分句，頭 3 句供你確認；活動名及 3 句都要填妥。</p>
      <div class="acts" style="margin-top:2px"><button class="btn primary" data-extract="${post.id}">列出最多 3 條候選</button><button class="btn" data-setup-cancel="${post.id}">取消</button></div></div>`, ''];
    if (step === 'criteria') return [h + `<p class="headline" style="margin-top:8px">${tt(0)}請確認這 ${draft.criteria.length} 條候選</p>
      <div class="crits">${draft.criteria.map(([, l]) => `<span class="crit">${esc(l)}</span>`).join('')}</div>
      <p class="note">之後存入〈${esc(draft.name)}〉的貼文都會自動對照，並記錄互動數字。只按字詞核對，唔代表理解句意。</p>
      <div class="acts"><button class="btn primary" data-use-camp="${post.id}"${draft.name && draft.criteria.length === 3 ? '' : ' disabled'}>用呢套開始</button><button class="btn" data-new-camp="${post.id}">返回修改</button></div>`, ''];
    return [h + `<p class="headline" style="margin-top:8px">活動追蹤要先知道你追緊邊個活動</p>
      <p class="ctx">貼上活動 brief：取「重點：」後的文字，按「；」或「。」分句，以頭 3 句作候選。之後每篇存入來都會自動核對，同時記錄互動數字。</p>
      <div class="acts"><button class="btn primary" data-new-camp="${post.id}">新增活動</button><button class="btn" data-campaign>選現有活動</button></div>`, ''];
  }

  // ----- 收藏整理: filed and easy to find again -----
  function archiveCard(post, head) {
    const id = post.id, note = notes.get(id);
    const edit = noteEditing.has(id)
      ? `<div class="note-in"><input data-note-input="${id}" value="${esc(note || '')}" placeholder="寫一句，之後搜尋找得返"><button class="btn primary" data-note-save="${id}">存</button></div>`
      : `${note ? `<p class="ctx">備註：${esc(note)}</p>` : ''}<div class="foot" style="margin-top:6px"><button class="ln" data-move="${id}">移動</button><button class="ln" data-note="${id}">${note ? '改備註' : '備註'}</button><button class="ln" data-folder>開啟收藏</button></div>`;
    return [head('· 已放好') + edit, ' compact'];
  }

  function renderSlot(post, enter = false, fresh = false) {
    if (!post) return;
    syncBtn(post);
    if(saved.get(post.id)==='topic' && !expandedCards.has(post.id)) { renderCompact(post); renderSP(); return; }
    const id = post.id, card = elOf(post).querySelector('.dl-card'), ws = saved.get(id), L = lensOf.get(id);
    const focused = document.activeElement;
    const focusAction = card.contains(focused) ? [...focused.attributes].filter((a) => a.name.startsWith('data-')).map((a) => [a.name, a.value]) : [];
    // F10: a card refresh must not discard the brief the user is still typing.
    const nameInput = $('[data-camp-name]', card), briefInput = $('[data-camp-brief]', card);
    if (prSetup.get(id) === 'form' && nameInput && briefInput) {
      campaignDrafts.set(id, { name: nameInput.value, text: briefInput.value });
    }
    const hadCard = !!card.firstElementChild;
    if (!ws || collapsed.has(id)) { card.innerHTML = ''; clearPhrases(id); clearPrMarks(id); if (expFor === id) closeExp(); return; }
    const acc = WS[ws].color;
    const noai = !cfg.ai && (ws === 'topic' || ws === 'product') ? '<span class="noai">未接 AI</span>' : '';
    const head = (status, dot = '') => `<div class="c-head"><span class="dt ${dot}"></span><span class="nm">${WS[ws].name}</span><span>${status}</span>${noai}<button class="c-x" data-x="${id}" aria-label="收起">×</button></div>`;
    let html, cls = 'card';
    if (ws === 'pr') { const [h, c] = prCard(post, head); html = h; cls += c; }
    else if (ws === 'archive') { const [h, c] = archiveCard(post, head); html = h; cls += c; }
    else {
      const j = jobs.get(id);
      if (!j) {
        html = head('· 只保留了貼文') + `<div class="acts"><button class="btn" data-retry="${id}">再抓留言</button></div>`; cls += ' compact';
      } else {
        const elapsed = `<span class="num" data-elapsed="${id}">${elapsedText(j)}</span>`;
        const by = ws === 'product' && cfg.profile && cfg.ai ? ` · 按「${PROFILE.name}」判斷` : '';
        if (j.state === 'done') {
          html = head(post.got ? `${by} · ${countLabel(post)}${post.capped ? ' · 抓取上限' : ''}` : `${by} · 已抓取`) + `<div class="${fresh ? 'body-in' : ''}">${doneBody(post, ws, L)}</div>`;
        } else if (j.state === 'failed') {
          html = head(`· <span class="bad">抓取失敗 · 試了 ${j.plan.length} 次（${fmt(j.spent)}）</span>`, 'fail') +
            `<p class="note">${ERR_TEXT[j.err] || '原因不明'}。貼文已經保存。</p>
             <div class="acts"><button class="btn primary" data-retry="${id}">重試</button><button class="btn" data-keep="${id}">只保留貼文</button></div>`;
        } else {
          const status = `· ${STATE_TEXT[j.state]} · ${elapsed}`;
          html = head(status, j.state === 'queued' ? 'idle' : 'live');
        }
      }
    }
    card.innerHTML = `<div class="${cls}${enter && !hadCard ? ' enter' : ''}" style="--acc:${acc}">${html}</div>`;
    if (focusAction.length) {
      const replacement = [...card.querySelectorAll('button, input, textarea, [tabindex]')].find((el) => focusAction.every(([name, value]) => el.getAttribute(name) === value));
      replacement?.focus({ preventScroll: true });
    }
    if(ws==='topic') card.insertAdjacentHTML('afterbegin',compactHTML(post));
    const done = jobs.get(id)?.state === 'done';
    if (ws === 'topic' && done && post.phrases && post.comments >= MIN_COMMENTS) setPhrases(post); else clearPhrases(id);
    if (ws === 'pr' && cfg.campaign) setPrMarks(post); else clearPrMarks(id);
    if (expFor === id && !(ws === 'topic' && done && post.shapes)) closeExp();
    renderSP();
  }

  // Campaign sentences matched in the post text are marked the same way as phrases: by range, never by editing Threads' DOM.
  const prRanges = new Map();
  function setPrMarks(post) {
    const node = $('.text', elOf(post)).firstChild, txt = node.textContent;
    prRanges.set(post.id, Object.entries(prHits(post)).map(([c, sent]) => {
      const at = txt.indexOf(sent);
      if (at < 0) return null;
      const r = new Range(); r.setStart(node, at); r.setEnd(node, at + sent.length);
      return { c, r };
    }).filter(Boolean));
    syncPr();
  }
  function clearPrMarks(id) { if (prRanges.delete(id)) syncPr(); }
  function syncPr() {
    if (!HL) return;
    const all = [...prRanges.values()].flat().map((x) => x.r);
    if (all.length) CSS.highlights.set('dl-pr', new Highlight(...all)); else CSS.highlights.delete('dl-pr');
  }
  function prHover(id, c) {
    if (!HL) return;
    const hit = id && prRanges.get(id)?.find((x) => x.c === c);
    if (hit) CSS.highlights.set('dl-pr-on', new Highlight(hit.r)); else CSS.highlights.delete('dl-pr-on');
  }
  function runCheck(post) {
    if (!cfg.ai || saved.get(post.id) !== 'pr' || !cfg.campaign) return;
    const token = Symbol('pr-ai'); prRequests.set(post.id, token);
    prState.set(post.id, 'run'); renderSlot(post);
    setTimeout(() => {
      if (prRequests.get(post.id) !== token || saved.get(post.id) !== 'pr' || !cfg.ai) return;
      prRequests.delete(post.id); prState.set(post.id, 'ai'); renderPrCards();
    }, cfg.rm ? 300 : 1400);
  }
  function openWheelFor(post) {
    const btn = btnOf(post), r = btn.getBoundingClientRect();
    showWheel(post, btn, r.left + r.width / 2, r.top + r.height / 2, true); centerText(-1);
  }

  function focusPost(post) {
    collapsed.delete(post.id); renderSlot(post);
    const el = elOf(post);
    el.scrollIntoView({ block: 'center', behavior: cfg.rm ? 'auto' : 'smooth' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    // Reading state clears only on explicit reader/card open.
    renderOrb();
  }

  function switchLens(post, L) {
    if (lensOf.get(post.id) === L) L = null;   // clicking the open entry closes it
    lensOf.set(post.id, L);
    if (jobs.get(post.id)?.state === 'done') {   // every entry came from the same reading: switching is instant
      renderSlot(post);
      if (expFor === post.id) openExp(post);   // evidence follows the open answer
      const body = elOf(post).querySelector('.answer');
      if (body && !cfg.rm) { body.classList.remove('body-in'); void body.offsetWidth; body.classList.add('body-in'); }
      return;
    }
    startReading(post, L);
    schedule(); renderSlot(post, false, true); renderOrb();
  }
  function retryCrawl(post) {
    jobs.set(post.id, newJob(post, post.retryPlan ?? [{ sec: estOf(post), ok: true }]));
    schedule(); renderSlot(post); renderOrb();
  }
  function keepOnly(post) {
    jobs.delete(post.id); unseen.delete(post.id);
    schedule(); renderSlot(post); renderOrb();
  }

  // ---------- phrase underline (CSS Custom Highlight API) ----------
  const HL = typeof CSS !== 'undefined' && 'highlights' in CSS;
  const phraseRanges = new Map();   // postId -> [{ r: Range, i }]
  let activePh = null;
  function setPhrases(post) {
    if (phraseRanges.has(post.id)) return;
    const node = $('.text', elOf(post)).firstChild, txt = node.textContent;
    const arr = post.phrases.map(([ph], i) => {
      const at = txt.indexOf(ph);
      if (at < 0) return null;
      const r = new Range(); r.setStart(node, at); r.setEnd(node, at + ph.length);
      return { r, i };
    }).filter(Boolean);
    phraseRanges.set(post.id, arr); syncHL();
  }
  function clearPhrases(id) {
    if (!phraseRanges.delete(id)) return;
    if (activePh && activePh.id === id) setActive(null);
    syncHL();
  }
  function syncHL() {
    if (!HL) return;
    const all = [...phraseRanges.values()].flat().filter((x) => x.i < 2).map((x) => x.r);
    if (all.length) CSS.highlights.set('dl-ph', new Highlight(...all)); else CSS.highlights.delete('dl-ph');
  }
  function setActive(id, i) {
    if (id != null && activePh && activePh.id === id && activePh.i === i) return;
    if (id == null && !activePh) return;
    activePh = id == null ? null : { id, i };
    const hit = activePh && phraseRanges.get(id)?.find((x) => x.i === i);
    if (HL) { if (hit) CSS.highlights.set('dl-ph-on', new Highlight(hit.r)); else CSS.highlights.delete('dl-ph-on'); }
    $$('.ph-row.on').forEach((r) => r.classList.remove('on'));
    if (activePh) $$(`.ph-row[data-id="${id}"][data-i="${i}"]`).forEach((r) => r.classList.add('on'));
  }
  function phraseAt(id, x, y) {
    const arr = phraseRanges.get(id);
    if (!arr) return -1;
    const hit = arr.filter((p) => p.i < 2).find((p) => [...p.r.getClientRects()].some((rc) => x >= rc.left - 1 && x <= rc.right + 1 && y >= rc.top - 2 && y <= rc.bottom + 4));
    return hit ? hit.i : -1;
  }

  // ---------- 展開: one window per post — the evidence for the open answer, minus what the card already shows ----------
  // Reply rows in Threads' shape. Crawl fields: author, time_token, like_count, reply_count. No avatar URL is stored, so initials stand in.
  // Reply counts and times below are fixture values derived from each quote; the real ones come from the crawl.
  const hueOf = (h) => [...h].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
  const postMin = (p) => { const m = String(p.ago).match(/(\d+)\s*(分鐘|小時|天)/); return m ? +m[1] * (m[2] === '天' ? 1440 : m[2] === '小時' ? 60 : 1) : 60; };
  const agoText = (min) => (min < 60 ? `${Math.max(1, Math.round(min))}分鐘` : min < 1440 ? `${Math.round(min / 60)}小時` : `${Math.round(min / 1440)}天`);
  const ASKERS = ['ask.one', 'curious.k', 'newbie.hk', 'q.mark', 'learn.more', 'just.asking'];
  function replyRow(post, q, opts = {}) {
    const h = [...q[0]].reduce((a, c) => (a * 33 + c.charCodeAt(0)) % 9973, 5);
    const replies = opts.replies ?? Math.round(likeN(q[2]) / (9 + (h % 12)));
    const ago = agoText(postMin(post) * (opts.later ? 0.15 : 0.3 + (h % 60) / 100));
    return `<div class="rp" data-src>
      <div class="rp-l${opts.line ? ' line' : ''}"><span class="rp-av" style="--h:${hueOf(q[1])}">${esc(q[1][0].toUpperCase())}</span></div>
      <div><div class="rp-h"><b>${esc(q[1])}</b>${opts.author ? '<span class="au">作者</span>' : ''}<span>${ago}</span><i>Threads ↗</i></div>
        <p>${esc(q[0])}</p>
        <div class="rp-m"><span>${I.heart}${esc(q[2])}</span><span>${I.comment}${replies}</span></div></div>
    </div>`;
  }
  function expHTML(post) {
    const ws = WS[saved.get(post.id)], L = lensOf.get(post.id), seen = shownQ.get(post.id) || new Set();
    const evq = (q) => (seen.has(q[0]) ? '' : replyRow(post, q));
    const grp = (c, name, n, inner) => `<div class="ty" style="--c:${c}"><div class="ty-h"><i></i><b>${esc(name)}</b><span>${n}</span></div>${inner}</div>`;
    let title, body;
    if (cfg.ai && L === 'method' && post.methods.length) {
      title = '做法：適用情境與原句';
      body = post.methods.map(([a, n, ctx, q]) => grp('var(--acc)', a, '', `<p class="xp-ctx">${esc(ctx)}</p>${evq(q)}`)).join('');
    } else if (cfg.ai && L === 'split' && post.split.sides) {
      title = '兩邊的理由與原句';
      body = post.split.sides.map(([c, why, n, q], i) => grp(i ? SH.amber : SH.teal, c, '', `<p class="xp-ctx">${esc(why)}</p>${evq(q)}`)).join('');
    } else if (L === 'ask' && post.ask.length) {
      title = '問題與回覆';
      // The question, then the reply under it on a thread line — the shape Threads itself uses for a reply chain.
      const chain = ([q, n, a, ans], i) => {

  function keywordSuggestion(p) {
    // Literal overlap, with Latin words and CJK bigrams. No provider call or semantic inference.
    const source=[p.text,...(KW[p.id]||[])].join(' ').toLowerCase();
    const tokens=(text)=>[...new Set((text.toLowerCase().match(/[a-z][a-z0-9_+-]{2,}|[\u3400-\u9fff]{2,}/g)||[]).flatMap(w=>/^[a-z]/.test(w)?[w]:[...w].slice(0,-1).map((_,i)=>w.slice(i,i+2))))];
    return TOPICS.map(t=>{const words=tokens([t.name,t.question||'',...t.frames.flatMap(f=>f.kw),...t.frames.flatMap(f=>f.posts.map(x=>x[2]))].join(' '));const hit=words.filter(w=>source.includes(w));return {t,hit,score:hit.length};}).filter(x=>x.score).sort((a,b)=>b.score-a.score||(b.t.used||0)-(a.t.used||0))[0];
  }

  function evidenceForReader(p,L) {

  function handleV13Click(t) {

    const lt=t.closest('[data-line-topic]');if(lt){const id=lt.dataset.post;linePick.delete(id);if(lt.dataset.lineTopic)assignTopic(id,lt.dataset.lineTopic);else renderSlot(postById(id));return true;}

    const tab=t.closest('[data-panel-tab]');if(tab){panelState.tab=tab.dataset.panelTab;panelState.mode=null;panelState.reader=null;renderSP();return true;}
    const ws=t.closest('[data-workspace]');if(ws){panelState.mode=ws.dataset.workspace;panelState.reader=null;renderSP();return true;}
    if(t.closest('[data-workspace-home]')){panelState.mode=null;panelState.reader=null;renderSP();return true;}
    const rd=t.closest('[data-reader]');if(rd){openReader(rd.dataset.reader);return true;}
    if(t.closest('[data-reader-back]')){panelState.reader=null;renderSP();return true;}
    const ln=t.closest('[data-reader-lens]');if(ln){panelState.lens=ln.dataset.readerLens;renderSP();return true;}
    if(t.closest('[data-reader-evidence]')){panelState.evidence=!panelState.evidence;renderSP();return true;}
    const tog=t.closest('[data-card-toggle]');if(tog){toggleCard(tog.dataset.cardToggle);return true;}
    const assign=t.closest('[data-assign]');if(assign){assignTopic(assign.dataset.assign,assign.dataset.to);return true;}
    const mv=t.closest('[data-to-product]');if(mv){save(postById(mv.dataset.toProduct),'product',null);renderSP();return true;}
    if(t.closest('[data-new-topic]')){panelState.form=!panelState.form;renderSP();$('#new-topic-form input')?.focus();return true;}
    if(t.closest('[data-all-done]')){panelState.allDone=true;panelState.query='';renderSP();return true;}

    const full=t.closest('[data-show-feed-card]');if(full){const p=postById(full.dataset.showFeedCard);collapsed.delete(p.id);focusPost(p);return true;}
    if(panelState.reader&&t.closest('[data-xclose]')){panelState.evidence=false;renderSP();return true;}
    return false;
  }

    } else if (kind === 'discourse') {
      ['p1', 'p2', 'p8', 'p5'].forEach((id) => { forceDone(P(id)); assignTopic(id,FEED_FRAME[id][0],false); });
      panelState.tab='workspaces'; panelState.mode='topic';
      forceDone(target = P('p11'));
      if (!cfg.cp) { cfg.cp = true; applyCfg(); }
    } else if (kind === 'prsetup') {
      cfg.campaign = false; target = P('p12'); save(target, 'pr', null, { quiet: true });
    } else if (kind === 'archive') {
      target = P('p3'); save(target, 'archive', null, { quiet: true }); notes.set('p3', '改版時參考：設計價值＝知道什麼該刪'); renderSlot(target);
    } else if (kind === 'failed') {
      target = P('p10'); save(target, 'topic', 'stance', { quiet: true });
      const j = jobs.get('p10'); Object.assign(j, { state: 'failed', attempt: 2, err: 'max_attempts_exceeded', spent: 396 });
      schedule(); renderSlot(target);
    }
    renderOrb();
    const generation = gen;
    requestAnimationFrame(() => { if (generation === gen) focusPost(target); });
  }

  // ---------- tuning panel ----------
  function applyCfg() {
    const root = document.documentElement;
    root.style.setProperty('--k', String(K()));
    root.style.setProperty('--ease', EASE[cfg.spring]);
    root.style.setProperty('--cp-w', cpW() + 'px');
    root.classList.toggle('rm', cfg.rm);
    document.body.classList.toggle('no-scn', !cfg.scn);
    document.body.classList.toggle('tiers', cfg.tiers);
    $('#cp').classList.toggle('open', cpW() > 0);
    renderSP();
    $('#o-hold').textContent = cfg.hold + 'ms';
    $('#o-rad').textContent = cfg.radius + 'px';
    $$('.seg [data-k]').forEach((g) => g.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.v === String(cfg[g.dataset.k]))));
    $$('.toggles button').forEach((b) => b.classList.toggle('on', !!cfg[b.dataset.t]));
  }
  $('#c-hold').value = cfg.hold; $('#c-rad').value = cfg.radius;
  $('#c-hold').oninput = (e) => { cfg.hold = +e.target.value; applyCfg(); };
  $('#c-rad').oninput = (e) => { cfg.radius = +e.target.value; if (W) closeWheel('cancel'); buildWheel(); applyCfg(); };
  $$('.seg [data-k]').forEach((g) => g.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    cfg[g.dataset.k] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v;
    applyCfg();
  }));
  $('.toggles').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    cfg[b.dataset.t] = !cfg[b.dataset.t]; applyCfg();
    if (b.dataset.t === 'cp') { closeExp(); renderSP(); }
    if (b.dataset.t === 'ai') renderSP();
    if (b.dataset.t === 'ai') {   // the entry set changes with AI, so open answers close
      closeExp();
      POSTS.forEach((p) => {
        const ws = saved.get(p.id); if (!ws) return;
        lensOf.set(p.id, null);
        if (READS_WS.has(ws)) {
          const j = jobs.get(p.id);
          if (!cfg.ai && j?.state === 'reading') j.state = 'done';
          else if (cfg.ai && j?.state === 'done' && crawled.has(p.id)) startReading(p, null);
        }
        if (ws === 'pr' && !cfg.ai) { prRequests.delete(p.id); if (prState.has(p.id)) prState.set(p.id, 'lit'); }
        renderSlot(p);
      });
      renderOrb();
    }
    if (b.dataset.t === 'sound' && cfg.sound) blip(784, 0.08, 0.03);
  });
  $('.jumps').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) scenario(b.dataset.j); });
  $('#p-head').onclick = () => $('#panel').classList.toggle('min');
  $('#reset').onclick = resetAll;
  $('#src').innerHTML = SOURCES.map(([what, from, tier, st]) => `<li><b>${what}</b>${from}<em class="${st === '之後' ? 'new' : ''}">${tier} · ${st}</em></li>`).join('');
  if (innerWidth < 1400) $('#panel').classList.add('min');

  const originalP2Text=postById('p2').text;
  $('#sp-logo').innerHTML = I.dl;
  renderFeed(); buildWheel(); applyCfg(); renderOrb(); refreshCounts(); tick(); trackNow();
})();
</script>
</body>
</html>
