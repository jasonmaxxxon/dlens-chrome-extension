<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DLens v13 · 快存，側欄讀</title>
<!--
  2026-10-13 mockup — radial converge v13. Reference only; all records are local fixtures.
  A: v12 wheel physics/hold/flick timing retained; 250ms topic outer arc = Topic records,
     ordered by last explicit assignment (recent use), counts = Topic + Signal membership.
  B: replaces save-time full topic card with a 36px line; 1s real-time peek = same-origin
     post-page replies, top-liked of the visible sample. Wait = existing polling + estimated
     crawl duration, never measured percent. Ready = stored inline reading + crawl comments.
     Full v12 card is disclosed only on demand. Off-screen completion glows once on return.
  C: 收藏 adopts collection-B header/rows and paper + sage mist + inline SVG grain.
     剛讀完 = completion transitions of existing polling, latest 3; unread = local open state.
  D: 400px reader reuses v12 entries, answers, colours and reply evidence from the same
     stored inline reading. Topic picker = existing signal/triage assignment; no extra AI.
  E: mode tiles use the existing wheel compass/cube/shield/box icons and mode colours.
  F: 工作區 adopts discourse-A chips/未分流/發現/講法. Topic.name + optional Topic.context.researchQuestion
     (existing TopicContext field); suggestions = literal keyword overlap across topic name,
     question, post text and cluster keywords, no AI. No comment-stance/profile crawl.
  Removed: v12 save-time full topic card and panel per-comment-stance finding.
  Feed fixtures, crawl clock, tuning panel and reduced motion retained. Two extra tuning
     scenarios exercise zero topics and the Codex keyword suggestion (fixture caption).
-->

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>
@property --p { syntax: '<percentage>'; inherits: false; initial-value: 0%; }

:root {
  --ink: #1b1a17; --sub: #4a4840; --soft: #8a877c; --faint: #c3c0b6; --hair: rgba(27,26,23,.08); --wash: #fbfbfa;
  --fail: #a8462e; --k: 1; --ease: cubic-bezier(.3,1.32,.5,1); --cp-w: 0px;
  --ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang TC', 'Noto Sans TC', system-ui, sans-serif;
  /* Threads stand-in */
  --t-page: #fafafa; --t-card: #fff; --t-fg: #000; --t-sub: #999; --t-line: rgba(0,0,0,.12); --t-icon: #424242; --t-hover: rgba(0,0,0,.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--t-page); color: var(--t-fg); font: 15px/1.45 var(--ui); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Threads stand-in ---------- */
.rail { position: fixed; left: 0; top: 0; bottom: 0; width: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; color: var(--t-sub); }
.rail svg { width: 26px; height: 26px; }
.rail .on { color: var(--t-fg); }
.stage { margin-right: var(--cp-w); transition: margin-right calc(260ms * var(--k)) cubic-bezier(.2,.8,.2,1); }
.top { height: 60px; display: grid; place-items: center; font-weight: 600; font-size: 15px; }
.feed { width: min(620px, calc(100% - 32px)); margin: 0 auto 160px; background: var(--t-card); border: 1px solid var(--t-line); border-radius: 28px; }
.post { display: grid; grid-template-columns: 48px minmax(0, 1fr); padding: 14px 20px 10px; border-bottom: 1px solid var(--t-line); transition: background .6s; }
.post:first-child { border-radius: 28px 28px 0 0; }
.post:last-child { border-bottom: 0; border-radius: 0 0 28px 28px; }
.post.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 30% { background: rgba(63,90,59,.08); } 100% { background: transparent; } }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px;
  background: linear-gradient(135deg, hsl(var(--h) 55% 58%), hsl(calc(var(--h) + 40) 50% 42%)); }
.post header { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.handle { font-weight: 600; }
.time { color: var(--t-sub); }
.more { margin-left: auto; color: var(--t-sub); letter-spacing: 1px; }
.scn { margin-left: auto; font: 600 10.5px/1.7 var(--ui); color: #8a6d3b; background: rgba(160,106,23,.08); border-radius: 6px; padding: 0 7px; white-space: nowrap; }
.scn ~ .more { margin-left: 10px; }
body.no-scn .scn { display: none; }
body.no-scn .scn ~ .more { margin-left: auto; }
.text { white-space: pre-line; margin-top: 2px; overflow-wrap: anywhere; }
.media { margin-top: 10px; height: 180px; border-radius: 10px; border: 1px solid var(--t-line); overflow: hidden; display: flex; align-items: flex-end; gap: 10px; padding: 18px 22px;
  background: linear-gradient(160deg, #f4efe6, #e8eef2); }
.media i { flex: 1; border-radius: 6px 6px 2px 2px; background: #9fb5c9; }
.media i:nth-child(2n) { background: #3f5a3b; opacity: .8; }
.actions { display: flex; align-items: center; gap: 2px; margin: 6px 0 0 -8px; }
.act { display: flex; align-items: center; gap: 5px; border: 0; background: none; color: var(--t-icon); padding: 6px 9px; border-radius: 999px; font-size: 13px; cursor: pointer; }
.act:hover { background: var(--t-hover); }
.act svg { width: 19px; height: 19px; }
.grow { flex: 1; }

/* F08: only the Threads stand-in changes below 620px; keep the DLens button intact. */
@media (max-width: 619px) {
  .actions { flex-wrap: wrap; }
  .act { min-width: 0; padding-inline: 5px; }
  .act span { overflow-wrap: anywhere; }
  .grow { flex-basis: 0; }
}

/* Phrase underline: CSS Custom Highlight API, so the Threads DOM is never touched. */
::highlight(dl-ph) { text-decoration: underline; text-decoration-color: rgba(63,90,59,.42); text-decoration-thickness: 2px; text-underline-offset: 4px; }
::highlight(dl-pr-on) { background-color: rgba(122,32,48,.2); text-decoration: underline; text-decoration-color: #7a2030; text-decoration-thickness: 2px; text-underline-offset: 4px; }
::highlight(dl-pr) { background-color: rgba(122,32,48,.09); text-decoration: underline; text-decoration-color: rgba(122,32,48,.5); text-decoration-thickness: 2px; text-underline-offset: 4px; }
::highlight(dl-ph-on) { background-color: rgba(63,90,59,.13); text-decoration: underline; text-decoration-color: #3f5a3b; text-decoration-thickness: 2px; text-underline-offset: 4px; }

/* ---------- DLens inline button ---------- */
.dl-btn { position: relative; width: 36px; height: 36px; border: 0; border-radius: 50%; background: none; color: var(--t-icon); display: grid; place-items: center; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; flex: none; }
.dl-btn:hover { background: var(--t-hover); }
.dl-btn:focus-visible { outline: 2px solid var(--ring, #3f5a3b); outline-offset: 2px; }
.dl-btn svg { width: 20px; height: 20px; transition: transform 140ms ease; }
.dl-btn .bm { transition: fill 160ms, stroke 160ms; }
.dl-btn.saved { color: var(--acc); }
.dl-btn.saved .bm { fill: var(--acc); stroke: var(--acc); }
.dl-btn.saved .lens { stroke: #fff; }
.dl-btn.charging svg { transform: scale(.86); }
.dl-btn .ring, .dl-btn .prog { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; opacity: 0;
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); }
.dl-btn .ring { background: conic-gradient(var(--ring, #3f5a3b) var(--p), transparent 0); }
.dl-btn.charging .ring { opacity: 1; animation: charge var(--hold, 180ms) linear forwards; }
@keyframes charge { from { --p: 0%; } to { --p: 100%; } }
/* Crawl state on the button: a turning arc, never a percentage. The backend cannot know how far a crawl has got. */
.dl-btn .prog { background: conic-gradient(var(--acc) 0 24%, color-mix(in srgb, var(--acc) 14%, transparent) 0); transition: opacity .3s; }
.dl-btn.busy .prog { opacity: .9; animation: spin 1.2s linear infinite; }
.dl-btn.busy.queued .prog { opacity: .5; animation: none; background: color-mix(in srgb, var(--acc) 22%, transparent); }
@keyframes spin { to { transform: rotate(1turn); } }
.dl-btn.charging .prog { opacity: 0; }
.dl-btn .dot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 2px var(--t-card); transform: scale(0); transition: transform 240ms var(--ease); pointer-events: none; }
.dl-btn.ready .dot { transform: scale(1); }
.dl-btn.failed .dot { background: var(--fail); transform: scale(1); }
.dl-btn .burst { position: absolute; inset: 2px; border-radius: 50%; border: 2px solid var(--acc, #3f5a3b); opacity: 0; pointer-events: none; }
.dl-btn.pop .burst { animation: burst 460ms ease-out; }
.dl-btn.pop svg { animation: pop 420ms var(--ease); }
@keyframes burst { from { transform: scale(.6); opacity: .75; } to { transform: scale(2.1); opacity: 0; } }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(.8); } 70% { transform: scale(1.22); } 100% { transform: scale(1); } }
.dl-chip { border: 0; cursor: pointer; font: 600 11.5px/1 var(--ui); color: var(--acc); padding: 6px 10px; border-radius: 999px; margin-right: 2px; white-space: nowrap;
  background: color-mix(in srgb, var(--acc) 10%, transparent); animation: chipIn 280ms var(--ease); }
.dl-chip:hover { background: color-mix(in srgb, var(--acc) 16%, transparent); }
@keyframes chipIn { from { opacity: 0; transform: translateX(8px) scale(.9); } to { opacity: 1; transform: none; } }

/* ---------- Wheel (two rings) ---------- */
#scrim { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 40;
  background: radial-gradient(circle at var(--cx, 50%) var(--cy, 50%), rgba(12,14,12,.20), rgba(12,14,12,.09) 260px, rgba(12,14,12,.03) 600px);
  transition: opacity calc(160ms * var(--k)) linear; }
#scrim.on { opacity: 1; }
.wheel { position: fixed; z-index: 50; pointer-events: none; transform: scale(.78); opacity: 0; font-family: var(--ui);
  transition: transform calc(240ms * var(--k)) var(--ease), opacity calc(110ms * var(--k)) linear; }
.wheel[hidden] { display: none; }
.wheel.open { transform: scale(1); opacity: 1; }
.wheel.sticky { pointer-events: auto; cursor: pointer; }
.wheel.closing { transform: scale(.88); opacity: 0; transition: transform calc(130ms * var(--k)) ease-in, opacity calc(130ms * var(--k)) linear; }
.wheel.commit { transform: translate(var(--fx), var(--fy)) scale(.14); opacity: 1; transition: transform calc(240ms * var(--k)) cubic-bezier(.55,0,.8,.25); }
.wheel-glass { position: absolute; border-radius: 50%; background: rgba(255,255,255,.36); border: 1px solid rgba(255,255,255,.72);
  backdrop-filter: blur(16px) saturate(1.5); -webkit-backdrop-filter: blur(16px) saturate(1.5);
  box-shadow: 0 26px 60px -18px rgba(0,0,0,.36), 0 2px 6px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.8);
  transition: opacity calc(120ms * var(--k)); }
#wheel-svg { position: absolute; inset: 0; overflow: visible; }
.sector { transform-box: view-box; transform-origin: center;
  transform: translate(var(--px, 0px), var(--py, 0px)) scale(var(--s, .7)); opacity: 0;
  transition: transform calc(230ms * var(--k)) var(--ease), opacity calc(140ms * var(--k)) linear;
  transition-delay: calc(var(--i) * 14ms * var(--k)); }
.sector path { fill: var(--tint); stroke: var(--tint); stroke-width: 6; stroke-linejoin: round; transition: fill 110ms, stroke 110ms; }
.wheel.open .sector { --s: 1; opacity: 1; }
.sector.sel { --px: var(--dx); --py: var(--dy); }
.sector.sel path, .sector.picked path { fill: var(--acc); stroke: var(--acc); }
.wheel.open .sector.picked { --s: 1.06; --px: var(--dx2); --py: var(--dy2); transition-delay: 0s; }
.wheel.commit .sector { opacity: 0; transition-delay: 0s; }
.wheel.commit .sector.picked { opacity: 1; --s: 1; }
.wheel.settled .sector, .wheel.settled .lbl { transition-delay: 0s; }
.lbl { position: absolute; width: 78px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--ink);
  transform: translate(-50%, -50%) translate(var(--px, 0px), var(--py, 0px)) scale(var(--s, .6)); opacity: 0;
  transition: transform calc(230ms * var(--k)) var(--ease), opacity calc(140ms * var(--k)) linear, color 110ms;
  transition-delay: calc(var(--i) * 14ms * var(--k)); }
.wheel.open .lbl { --s: 1; opacity: 1; }
.lbl b { font-size: 12.5px; font-weight: 650; letter-spacing: .01em; white-space: nowrap; }
.lbl small { font-size: 10px; line-height: 1.2; color: var(--soft); font-variant-numeric: tabular-nums; transition: color 110ms; }
.lbl.cur small { color: var(--acc); font-weight: 650; }
.lbl .ic { color: var(--acc); display: grid; transition: color 110ms; }
.lbl .ic svg { width: 18px; height: 18px; }
.lbl.sel, .lbl.picked { --px: var(--dx); --py: var(--dy); color: #fff; }
.lbl.sel b, .lbl.picked b { color: #fff; }
.lbl.sel .ic, .lbl.sel small, .lbl.picked .ic, .lbl.picked small { color: rgba(255,255,255,.88); }
.wheel.commit .lbl { opacity: 0; transition-delay: 0s; }
.wheel-center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; background: #fff;
  box-shadow: 0 3px 10px rgba(0,0,0,.13), 0 0 0 1px rgba(27,26,23,.06); display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 6px; transition: opacity calc(120ms * var(--k)); }
.wheel.commit .wheel-center, .wheel.commit .wheel-glass { opacity: 0; }
.c-title { max-width: 100%; font-size: 12px; font-weight: 700; line-height: 1.25; color: var(--c-acc, var(--ink)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-sub { font-size: 9.5px; line-height: 1.35; color: var(--soft); margin-top: 3px; font-variant-numeric: tabular-nums; }
.ptr { position: absolute; inset: -5px; border-radius: 50%; pointer-events: none; opacity: var(--po, 0);
  background: conic-gradient(from calc(var(--ang, 0deg) - 26deg), var(--pc, #9a978c) 0 52deg, transparent 52deg);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); }

/* ---------- Slot under the post ---------- */
.dl-card:empty, .dl-exp:empty { display: none; }
.card { position: relative; overflow: hidden; margin: 10px 0 6px; padding: 14px 16px; border-radius: 14px; background: var(--wash); border: 1px solid var(--hair);
  font: 400 13px/1.55 var(--ui); color: var(--ink); }
.card.enter { animation: cardIn calc(260ms * var(--k)) var(--ease); }
.card.compact { padding: 9px 12px; }
@keyframes cardIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.body-in { animation: fadeUp calc(280ms * var(--k)) ease-out; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.c-head { display: flex; align-items: center; gap: 7px; font-size: 12px; line-height: 1.3; color: var(--soft); min-height: 18px; }
.c-head .dt { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); flex: none; }
.c-head .dt.idle { background: var(--faint); }
.c-head .dt.live { animation: breathe 1.1s ease-in-out infinite; }
.c-head .dt.fail { background: var(--fail); }
@keyframes breathe { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--acc) 14%, transparent); } }
.c-head .nm { font-weight: 650; color: var(--acc); }
.c-head .ln-n { color: var(--sub); }
.c-head .bad { color: var(--fail); font-weight: 600; }
.c-x { margin-left: auto; border: 0; background: none; color: var(--soft); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 5px; border-radius: 6px; }
.c-x:hover { background: var(--t-hover); color: var(--ink); }
.gist { margin: 8px 0 0; font-size: 14px; line-height: 1.6; }
@keyframes grow { from { transform: scaleX(0); } }
.sep { height: 1px; background: var(--hair); margin: 12px 0 6px; }
.k { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--soft); margin: 0 0 2px; }
.ph-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: baseline; width: calc(100% + 12px); margin: 0 -6px; padding: 5px 6px;
  border: 0; background: none; border-radius: 8px; text-align: left; cursor: default; font-size: 13px; transition: background 120ms; }
.ph-row .ph { color: var(--ink); white-space: nowrap; text-decoration: underline; text-decoration-color: rgba(63,90,59,.32); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.ph-row .lb { color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph-row .ct { color: var(--soft); font-size: 12px; font-variant-numeric: tabular-nums; }
.ph-row.on { background: color-mix(in srgb, var(--acc) 9%, transparent); }
.ph-row.on .ph { text-decoration-color: var(--acc); }
.side-h { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.side-h b { font-weight: 600; }
.side-h span { font-size: 12px; color: var(--soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.foot { display: flex; align-items: center; gap: 2px; margin-top: 10px; font-size: 12px; color: var(--soft); flex-wrap: wrap; }
.foot .lab { margin-right: 4px; }
.foot .ln { border: 0; background: none; padding: 3px 6px; border-radius: 6px; color: var(--sub); cursor: pointer; font-size: 12px; }
.foot .ln:hover { background: var(--t-hover); color: var(--ink); }
.foot .open { margin-left: auto; color: var(--acc); font-weight: 600; }
.foot .open.on { background: color-mix(in srgb, var(--acc) 10%, transparent); }
.sk { margin-top: 10px; }
.sk i { display: block; height: 9px; border-radius: 5px; background: linear-gradient(90deg, #eeede9 0, #f7f6f3 40%, #eeede9 80%); background-size: 200% 100%; animation: shimmer 1.1s linear infinite; }
.sk i + i { width: 58%; margin-top: 8px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.note { margin: 6px 0 0; font-size: 12.5px; color: var(--soft); }
.fine { font-size: 11.5px; color: var(--soft); }
.acts { display: flex; gap: 8px; margin-top: 10px; }
.btn { font: 600 12px var(--ui); border-radius: 8px; padding: 6px 11px; border: 1px solid var(--hair); background: #fff; color: var(--ink); cursor: pointer; }
.btn:hover { border-color: rgba(27,26,23,.18); }
.btn.primary { background: var(--acc); border-color: transparent; color: #fff; }
.tag { display: inline-block; font: 600 11px/1 var(--ui); padding: 5px 8px; border-radius: 999px; color: var(--acc); background: color-mix(in srgb, var(--acc) 10%, transparent); margin-top: 9px; }
.reply { padding: 6px 0; font-size: 13px; }
.reply + .reply { border-top: 1px solid var(--hair); }
.reply cite { display: block; font-style: normal; font-size: 11.5px; color: var(--soft); }

/* ---------- Mode cards ---------- */
.card { container-type: inline-size; }
.headline { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.5; color: var(--ink); }
.ctx { margin: 3px 0 0; font-size: 13px; line-height: 1.55; color: var(--sub); }
.sub-k { display: flex; justify-content: space-between; gap: 8px; margin: 14px 0 4px; font-size: 12px; color: var(--soft); }
.entries { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 4px; margin: 12px -6px 0; border-bottom: 1px solid var(--hair); }
.entry { position: relative; display: grid; gap: 5px; align-content: start; min-width: 0; text-align: left; border: 0; background: none; padding: 10px 10px 12px; border-radius: 8px 8px 0 0;
  color: var(--sub); cursor: pointer; transition: background 120ms; }
.entry:hover { background: var(--t-hover); }
.entry .q { display: flex; align-items: baseline; gap: 7px; min-width: 0; font-size: 14px; font-weight: 600; color: var(--sub); white-space: nowrap; }
.entry .f em { font-style: normal; font-weight: 600; color: var(--ec); margin-right: 6px; font-variant-numeric: tabular-nums; }
.entry .f { font-size: 12.5px; line-height: 1.55; color: var(--sub); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.entry.on .q, .entry.on .f { color: var(--ink); }
.entry.on .q em { color: var(--acc); }
.entry.on::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--acc); }
@container (max-width: 470px) { .entries { grid-template-columns: 1fr 1fr; } .entry.on::after { bottom: 0; } }
.answer { padding-top: 16px; }
.ev { margin-top: 10px; padding-left: 10px; border-left: 2px solid color-mix(in srgb, var(--acc) 28%, transparent); }
.ev q { quotes: none; display: block; font-size: 13px; line-height: 1.55; color: var(--sub); }
.ev cite { display: block; font-style: normal; font-size: 11.5px; color: var(--soft); font-variant-numeric: tabular-nums; }
.go { margin-top: 4px; border: 0; background: none; padding: 0; font: 600 12px var(--ui); color: var(--acc); cursor: pointer; }
.verdict { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; }
.vchip { flex: none; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.vchip.try { background: #3f5a3b; color: #fff; }
.vchip.watch { background: rgba(160,106,23,.14); color: #7a5410; }
.vchip.low { background: rgba(27,26,23,.07); color: var(--sub); }
.vchip.thin { box-shadow: inset 0 0 0 1px rgba(27,26,23,.2); color: var(--sub); }
.lim { margin: 4px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.6; color: var(--sub); }
/* 活動追蹤 */
.crits { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.crit { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 999px; font-size: 12.5px; color: var(--soft); box-shadow: inset 0 0 0 1px rgba(27,26,23,.14); }
.crit.hit { color: var(--acc); font-weight: 600; background: color-mix(in srgb, var(--acc) 9%, transparent); box-shadow: none; }
.crit small { font-size: 10px; font-weight: 650; padding: 0 4px; border-radius: 4px; background: #f4e7eb; color: #7a2030; }
.pr-gap { margin: 12px 0 0; font-size: 12.5px; color: var(--sub); }
.pr-gap b { color: var(--fail); font-weight: 600; }
.pr-rec { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 14px; padding-top: 11px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; }
.pr-rec b { color: var(--ink); font-weight: 600; }
.pr-rec .ln { border: 0; background: none; padding: 3px 6px; border-radius: 6px; color: var(--sub); cursor: pointer; font-size: 12px; }
.pr-rec .ln:hover { background: var(--t-hover); color: var(--ink); }
.pr-rec .ln { margin-left: auto; }
.pr-form { display: grid; gap: 8px; margin-top: 10px; }
.pr-form label { display: grid; gap: 4px; font-size: 12px; color: var(--soft); }
.pr-form input, .pr-form textarea { font: 500 13px/1.5 var(--ui); color: var(--ink); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--hair); background: #fff; outline: none; resize: vertical; }
.pr-form input:focus, .pr-form textarea:focus { border-color: var(--acc); }
.note-in { display: flex; gap: 8px; margin-top: 8px; }
.note-in input { flex: 1; min-width: 0; font: 500 13px var(--ui); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--hair); background: #fff; outline: none; }
.note-in input:focus { border-color: var(--acc); }

/* ---------- v6: one shape per answer, single-line quotes ---------- */
.entry .ei { display: grid; align-self: center; color: var(--ec); flex: none; }
.entry .ei svg { width: 15px; height: 15px; }
.entry:hover { background: color-mix(in srgb, var(--ec) 7%, transparent); }
.entry.on { background: color-mix(in srgb, var(--ec) 6%, transparent); }
.entry.on::after { background: var(--ec); }
.stack { display: flex; gap: 3px; height: 8px; margin-top: 14px; }
.stack i { flex: var(--w) 1 0; border-radius: 3px; background: var(--c); transform-origin: left; animation: grow calc(420ms * var(--k)) var(--ease) both; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 9px; font-size: 12.5px; color: var(--sub); }
.legend span { white-space: nowrap; }
.legend span::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: 1px; }
.legend b { font-weight: 600; color: var(--ink); margin-right: 4px; }
.legend em { font-style: normal; color: var(--soft); font-variant-numeric: tabular-nums; }
.q1 { display: block; margin-top: 14px; padding-left: 12px; border-left: 2px solid color-mix(in srgb, var(--acc) 28%, transparent); font-size: 13px; color: var(--sub); min-width: 0; }
.q1 q { quotes: none; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.6; }
.q1 cite { display: block; margin-top: 1px; font-style: normal; font-size: 11.5px; color: var(--soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bars { margin-top: 10px; display: grid; gap: 2px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px 40px; gap: 12px; align-items: center; padding: 5px 0; font-size: 13px; color: var(--sub); }
.bar-row > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row.main { color: var(--ink); font-weight: 600; }
.bar-row i { height: 6px; border-radius: 3px; background: rgba(27,26,23,.06); overflow: hidden; }
.bar-row i b { display: block; height: 100%; border-radius: 3px; background: var(--acc); opacity: .75; transform-origin: left; animation: grow calc(420ms * var(--k)) var(--ease) both; }
.bar-row .n { font-size: 12px; font-weight: 400; color: var(--soft); text-align: right; font-variant-numeric: tabular-nums; }
.tug { display: flex; gap: 3px; height: 8px; margin-top: 12px; }
.tug i { flex: var(--w) 1 0; border-radius: 3px; background: var(--c); }
.tug-l { display: flex; justify-content: space-between; gap: 16px; margin-top: 7px; font-size: 13px; }
.tug-l span { min-width: 0; }
.tug-l span:last-child { text-align: right; }
.tug-l b { font-weight: 600; }
.tug-l em { display: block; font-style: normal; font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; }
.qrow { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 6px 0; font-size: 13px; color: var(--ink); }
.qrow > span:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qrow .n { font-size: 12px; color: var(--soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.qrow .go { margin: 0 0 0 8px; font-size: 12px; }
.qd { width: 8px; height: 8px; border-radius: 50%; align-self: center; }
.qd.a { background: #3f5a3b; }
.qd.o { background: #234f7a; }
.qd.n { box-shadow: inset 0 0 0 1.5px #a06a17; }
.qkey { display: flex; gap: 14px; margin-top: 8px; font-size: 11.5px; color: var(--soft); }
.qkey span { display: inline-flex; align-items: center; gap: 5px; }
.top-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 6px 0; font-size: 13px; }
.top-row .n { font-size: 12px; color: var(--soft); text-align: right; font-variant-numeric: tabular-nums; }
.top-row q { quotes: none; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-row q small { color: var(--soft); font-size: 11.5px; margin-left: 6px; }
.c-head .noai { font-size: 11px; color: var(--soft); padding: 0 6px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(27,26,23,.14); }
.via { font-size: 11px; font-weight: 500; color: var(--soft); margin-left: 8px; }
/* Data-source tags: hidden unless the 資料來源 toggle is on */
.tt { display: none; font: 600 9.5px/1.7 var(--ui); padding: 0 5px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; letter-spacing: .02em; white-space: nowrap; }
body.tiers .tt { display: inline-block; }
.tt.t0 { background: #e8eee6; color: #3f5a3b; }
.tt.t1 { background: #e5edf5; color: #234f7a; box-shadow: inset 0 0 0 1px rgba(35,79,122,.35); }
.tt.t2 { background: #f2ece2; color: #7a5410; }
.tt.t3 { background: #f4e7eb; color: #7a2030; }

/* ---------- Expanded view: one window per post ---------- */
#exp { position: absolute; z-index: 20; width: 340px; }
.xp { padding: 14px 16px; border-radius: 16px; background: #fff; border: 1px solid var(--hair); font: 400 13px/1.55 var(--ui); color: var(--ink);
  box-shadow: 0 18px 44px -16px rgba(27,26,23,.22), 0 2px 6px rgba(27,26,23,.05); animation: popIn calc(240ms * var(--k)) var(--ease); }
.dl-exp .xp { margin: 0 0 8px; box-shadow: none; background: var(--wash); }
@keyframes popIn { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
.xp-h { display: flex; align-items: baseline; gap: 8px; }
.xp-h b { font-size: 13.5px; font-weight: 650; }
.xp-h .c-x { margin-left: auto; }
.xp-sub { font-size: 11.5px; color: var(--soft); font-variant-numeric: tabular-nums; }
.xp-sec { margin-top: 14px; }
.xp-k { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--soft); margin-bottom: 2px; }
.ty { padding: 12px 0 10px; }
.ty + .ty { border-top: 1px solid var(--hair); }
.ty-h { display: grid; grid-template-columns: 7px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.ty-h i { width: 7px; height: 7px; border-radius: 2px; background: var(--c); }
.ty-h b { font-weight: 600; }
.ty-h span { font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* Replies drawn like Threads' own: avatar column, handle · time, text, then likes and replies. The whole row opens the reply on Threads. */
.rp { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 12px 0 2px; cursor: pointer; }
.rp-l { position: relative; }
.rp-l.line::after { content: ''; position: absolute; left: 13px; top: 34px; bottom: -8px; width: 2px; border-radius: 1px; background: rgba(0,0,0,.1); }
.rp-av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 11.5px var(--ui);
  background: linear-gradient(135deg, hsl(var(--h) 45% 60%), hsl(calc(var(--h) + 40) 42% 44%)); }
.rp-h { display: flex; align-items: baseline; gap: 6px; font-size: 13.5px; line-height: 1.3; }
.rp-h b { font-weight: 600; color: var(--t-fg); }
.rp-h span { font-size: 12.5px; color: var(--t-sub); }
.rp-h .au { font-size: 11px; font-weight: 600; color: var(--acc); }
.rp-h i { margin-left: auto; font-style: normal; font-size: 12px; color: var(--soft); opacity: 0; transition: opacity 120ms; }
.rp:hover .rp-h i { opacity: 1; }
.rp p { margin: 3px 0 0; font-size: 14px; line-height: 1.5; color: var(--t-fg); overflow-wrap: anywhere; }
.rp-m { display: flex; gap: 18px; margin-top: 7px; font-size: 12.5px; color: var(--t-icon); font-variant-numeric: tabular-nums; }
.rp-m span { display: inline-flex; align-items: center; gap: 5px; }
.rp-m svg { width: 15px; height: 15px; }
.rp-none { margin: 6px 0 0 38px; font-size: 12.5px; color: var(--soft); }
.rp-none .go { margin-left: 6px; }
.ty-bar { height: 4px; border-radius: 2px; background: rgba(27,26,23,.06); margin: 6px 0 0 15px; overflow: hidden; }
.ty-bar i { display: block; height: 100%; border-radius: 2px; background: var(--c); transform-origin: left; animation: grow calc(420ms * var(--k)) var(--ease) both; }
.ty q { quotes: none; display: block; margin: 6px 0 0 15px; font-size: 13px; line-height: 1.55; color: var(--sub); }
.ty cite { display: block; margin-left: 15px; font-style: normal; font-size: 11.5px; color: var(--soft); font-variant-numeric: tabular-nums; }
.xp-ctx { margin: 3px 0 0 15px; font-size: 12.5px; line-height: 1.55; color: var(--sub); }
.xp .foot { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--hair); }

/* ---------- Corner orb ---------- */
#orb { position: fixed; right: calc(22px + var(--cp-w)); bottom: 22px; z-index: 32; display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: right calc(260ms * var(--k)) cubic-bezier(.2,.8,.2,1), opacity .25s; }
#orb.idle { opacity: .5; }
#orb.idle:hover { opacity: 1; }
.orb-b { position: relative; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--hair); background: #fff; color: var(--sub); cursor: pointer; display: grid; place-items: center;
  box-shadow: 0 10px 26px -10px rgba(27,26,23,.3), 0 1px 3px rgba(27,26,23,.06); transition: transform 200ms var(--ease); }
.orb-b:hover { transform: scale(1.05); }
#orb-ic svg { width: 20px; height: 20px; }
.orb-ring { position: absolute; left: -7px; top: -7px; width: 66px; height: 66px; pointer-events: none; overflow: visible; }
.orb-ring path { fill: none; stroke-width: 3; stroke-linecap: round; }
.orb-ring .tr { stroke-opacity: .26; }
.orb-b .nd { position: absolute; top: 2px; right: 2px; width: 10px; height: 10px; border-radius: 50%; background: #3f5a3b; box-shadow: 0 0 0 2px #fff; transform: scale(0); transition: transform 240ms var(--ease); }
.orb-b .nd.fail { background: var(--fail); }
#orb.has-new .orb-b .nd { transform: scale(1); }
#orb.bump .orb-b { animation: pop 420ms var(--ease); }
.orb-l { font-size: 11px; color: var(--soft); white-space: nowrap; font-variant-numeric: tabular-nums; min-height: 15px; }
#orb-pop { position: fixed; right: calc(22px + var(--cp-w)); bottom: 100px; z-index: 33; width: 292px; max-height: min(420px, calc(100vh - 140px)); overflow-y: auto;
  padding: 8px; border-radius: 14px; background: #fff; border: 1px solid var(--hair); font: 400 13px/1.5 var(--ui); color: var(--ink);
  box-shadow: 0 18px 44px -16px rgba(27,26,23,.26); transform-origin: bottom right; transition: right calc(260ms * var(--k)) cubic-bezier(.2,.8,.2,1); }
#orb-pop[hidden] { display: none; }
#orb-pop:not([hidden]) { animation: popIn calc(220ms * var(--k)) var(--ease); }
.op-h { padding: 4px 8px 6px; font-size: 11.5px; color: var(--soft); }
.op-row { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 8px; border: 0; background: none; border-radius: 9px; text-align: left; cursor: pointer; }
.op-row:hover { background: var(--t-hover); }
.op-av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 11px var(--ui); background: linear-gradient(135deg, hsl(var(--h) 55% 58%), hsl(calc(var(--h) + 40) 50% 42%)); }
.op-main { min-width: 0; display: grid; }
.op-main b { font-size: 13px; font-weight: 600; }
.op-main small { font-size: 11.5px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.op-main small i { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); flex: none; }
.op-st { font-size: 11.5px; color: var(--sub); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.op-st.new { color: #3f5a3b; font-weight: 600; }
.op-st.bad { color: var(--fail); font-weight: 600; }
.op-empty { margin: 0; padding: 10px 8px; font-size: 12.5px; color: var(--soft); }

/* ---------- DLens side panel (Chrome side panel): the discourse layer ---------- */
#cp { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; z-index: 36; background: #fff; border-left: 1px solid #e3e3e3; transform: translateX(102%);
  transition: transform calc(260ms * var(--k)) cubic-bezier(.2,.8,.2,1); font: 400 13px/1.55 var(--ui); color: var(--ink); display: flex; flex-direction: column; }
#cp.open { transform: none; }
.sp-chrome { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; border-bottom: 1px solid #ececec; font: 600 13px var(--ui); color: #3c3c3c; }
.sp-chrome svg { width: 16px; height: 16px; display: block; }
.sp-chrome .chev { font-weight: 400; color: #9a9a9a; }
.sp-chrome button { margin-left: auto; border: 0; background: none; font-size: 16px; line-height: 1; color: #777; cursor: pointer; padding: 6px 8px; border-radius: 6px; }
.sp-chrome button:hover { background: #f1f1f1; }
#sp { flex: 1; overflow-y: auto; padding: 18px 20px 32px; }
.sp-topics { display: flex; flex-wrap: wrap; gap: 8px; }
.sp-topic { border: 0; padding: 5px 12px; border-radius: 999px; background: rgba(27,26,23,.05); font: 500 12.5px var(--ui); color: var(--sub); cursor: pointer; }
.sp-topic em { font-style: normal; color: var(--soft); margin-left: 6px; font-variant-numeric: tabular-nums; }
.sp-topic.on { background: #3f5a3b; color: #fff; }
.sp-topic.on em { color: rgba(255,255,255,.72); }
.sp-head { margin-top: 22px; }
.sp-head h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .01em; }
.sp-cov { margin-top: 4px; font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; }
.sp-now { margin-top: 16px; padding: 10px 12px; border-radius: 10px; background: rgba(63,90,59,.07); font-size: 12.5px; line-height: 1.5; color: var(--sub); }
.sp-now b { color: var(--ink); font-weight: 600; }
.sp-now small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--soft); }
.sp-now.hint { background: none; box-shadow: inset 0 0 0 1px rgba(27,26,23,.14); }
.sp-k { display: flex; justify-content: space-between; margin: 24px 0 4px; font-size: 12px; color: var(--soft); }
.fr { border-top: 1px solid var(--hair); }
.fr-h { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px 12px; padding: 13px 8px 14px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 8px; }
.fr-h:hover { background: var(--t-hover); }
.fr-name { font-size: 14.5px; font-weight: 600; color: var(--ink); }
.fr-new { font-style: normal; font-size: 11px; font-weight: 650; color: #a06a17; margin-left: 8px; }
.fr-n { font-size: 12.5px; color: var(--sub); font-variant-numeric: tabular-nums; }
.fr-bar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: rgba(27,26,23,.06); overflow: hidden; }
.fr-bar b { display: block; height: 100%; border-radius: 3px; background: #3f5a3b; opacity: .7; }
.fr-meta { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--soft); font-variant-numeric: tabular-nums; }
.fr-av { display: inline-flex; }
.fr-av .rp-av { width: 20px; height: 20px; font-size: 9.5px; box-shadow: 0 0 0 2px #fff; }
.fr-av .rp-av + .rp-av { margin-left: -6px; }
.fr-tag { margin-left: auto; font-size: 11px; font-weight: 600; color: #3f5a3b; }
.fr.now .fr-h { background: rgba(63,90,59,.08); box-shadow: inset 3px 0 0 #3f5a3b; }
.fr.hint .fr-h { box-shadow: inset 3px 0 0 rgba(63,90,59,.3); }
.fr.hint .fr-tag { color: var(--soft); font-weight: 500; }
.fr.flash .fr-h { animation: rowFlash 1.2s ease-out; }
@keyframes rowFlash { 0%, 40% { background: rgba(63,90,59,.18); } 100% { background: transparent; } }
html.rm .fr.flash .fr-h { animation: none; }
.fr-posts { display: grid; gap: 2px; padding: 0 0 12px; }
.sp-post { width: 100%; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px; border: 0; background: none; border-radius: 8px; text-align: left; cursor: pointer; }
.sp-post:hover { background: var(--t-hover); }
.sp-post .rp-av { width: 22px; height: 22px; font-size: 10px; }
.sp-pb { min-width: 0; display: grid; gap: 1px; font-size: 12.5px; line-height: 1.45; }
.sp-pb b { font-weight: 600; color: var(--t-fg); }
.sp-pb b span { font-weight: 400; color: var(--t-sub); margin-left: 6px; }
.sp-pb em { font-style: normal; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-pl { font-size: 11.5px; color: var(--soft); white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: 1px; }
.sp-pl.feed { color: #3f5a3b; font-weight: 600; }
.sp-few { margin: 16px 0 4px; font-size: 12.5px; color: var(--soft); }
.sp-absent { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--hair); font-size: 12.5px; line-height: 1.6; color: var(--sub); }
.sp-absent .sp-k { margin: 0 0 4px; }
.sp-absent + .sp-absent { margin-top: 14px; border-top: 0; padding-top: 0; }
/* 發現: one card per cross-post finding — label, one templated sentence, one shape, one link */
.fd { padding: 14px 14px 12px; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 1px rgba(27,26,23,.09); }
.fd + .fd { margin-top: 10px; }
.fd-k { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--soft); letter-spacing: .02em; }
.fd-k svg { width: 14px; height: 14px; color: var(--fc); }
.fd-t { margin: 7px 0 0; font-size: 14px; line-height: 1.6; color: var(--ink); }
.fd-t b { font-weight: 650; }
.fd-go { margin-top: 10px; border: 0; background: none; padding: 0; font: 600 12px var(--ui); color: #3f5a3b; cursor: pointer; }
.fd-go:hover { text-decoration: underline; }
.fd-posts { margin-top: 6px; }
.wk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.wk span { display: grid; gap: 4px; font-size: 10.5px; color: var(--soft); text-align: center; font-variant-numeric: tabular-nums; }
.wk span i { display: block; height: 30px; position: relative; }
.wk span i b { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 3px 3px 0 0; background: rgba(63,90,59,.22); min-height: 2px; }
.wk span.hot i b { background: #3f5a3b; }
.mb { display: grid; gap: 5px; margin-top: 12px; }
.mb-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px 44px; gap: 10px; align-items: center; font-size: 12px; color: var(--sub); }
.mb-row > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mb-row i { height: 6px; border-radius: 3px; background: rgba(27,26,23,.06); overflow: hidden; }
.mb-row i b { display: block; height: 100%; border-radius: 3px; background: rgba(160,106,23,.45); }
.mb-row.hot { color: var(--ink); font-weight: 600; }
.mb-row.hot i b { background: #a06a17; }
.mb-row .v { text-align: right; color: var(--soft); font-weight: 400; font-variant-numeric: tabular-nums; }
.dv { display: grid; gap: 5px; margin-top: 12px; }
.dv-row { display: grid; grid-template-columns: minmax(0, 1fr) 70px 70px; gap: 0 8px; align-items: center; font-size: 12px; color: var(--sub); }
.dv-row > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Toast + tip ---------- */
#toast { position: fixed; left: calc((100vw - var(--cp-w)) / 2); bottom: 26px; z-index: 60; display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 16px; border-radius: 999px;
  background: #1b1a17; color: #f4f2ec; font: 500 13px/1.3 var(--ui); box-shadow: 0 12px 30px -8px rgba(0,0,0,.4); max-width: calc(100vw - 24px);

/* v13: one-line capture, topic arc and the shipped B/A side-panel grammar. */
.mode-tile { flex:none; display:inline-grid; place-items:center; width:32px; height:32px; border-radius:10px; color:var(--mc); background:color-mix(in srgb,var(--mc) 10%,#fff); }

#topic-arc { position:absolute; inset:0; pointer-events:none; }

.arc-seg { transform-box:view-box; transform-origin:center; opacity:0; transform:scale(.9); transition:transform calc(230ms * var(--k)) var(--ease), opacity calc(140ms * var(--k)) linear; transition-delay:calc(var(--i) * 32ms * var(--k)); }
