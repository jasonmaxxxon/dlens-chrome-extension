<!doctype html>
<!--
  DLens Product Refit B · Extension Routes
  Reference-only, standalone interaction mockup. The seven supplied Product
  signals remain the sole content source; unavailable fields stay unavailable.
-->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Refit B · Extension Routes</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg: #f2f7f3;
      --surface: #f8fbf8;
      --elevated: #ffffff;
      --ink: #1b1a17;
      --sub-ink: #3d3b35;
      --muted: #6c695e;
      --line: rgba(27, 26, 23, 0.10);
      --line-strong: rgba(27, 26, 23, 0.18);
      --context: rgba(242, 247, 243, 0.72);
      --rail: rgba(248, 251, 248, 0.94);
      --product: #234f7a;
      --product-soft: rgba(35, 79, 122, 0.10);
      --amber: #a16a17;
      --canvas: linear-gradient(172deg, #ffffff 0%, #f8fbf8 55%, #f2f7f3 100%);
      --panel: linear-gradient(168deg, rgba(255,255,255,0.84), rgba(255,255,255,0.50));
      --shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 1px 2px rgba(27,26,23,0.045), 0 8px 16px -6px rgba(27,26,23,0.08), 0 20px 38px -16px rgba(27,26,23,0.11);
      --font-serif: "Noto Serif TC", "Songti TC", "Source Han Serif TC", Iowan Old Style, Charter, Georgia, serif;
      --font-sans: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 12px;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.5;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    button { color: inherit; font: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .42; }
    h1, h2, h3 { margin: 0; font-family: var(--font-serif); text-wrap: balance; }
    p { margin: 0; text-wrap: pretty; }
    [hidden] { display: none !important; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .extension-shell {
      width: min(720px, calc(100vw - 24px));
      height: min(780px, calc(100vh - 24px));
      min-height: 560px;
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--canvas);
      box-shadow: var(--shadow);
    }
    .route-rail {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 8px 12px;
      border-right: 1px solid var(--line);
      background: var(--rail);
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      background: var(--elevated);
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 800;
    }
    .route-nav { width: 100%; display: grid; gap: 7px; margin-top: 24px; }
    .route-button {
      width: 100%;
      min-height: 58px;
      display: grid;
      place-items: center;
      gap: 2px;
      padding: 7px 3px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
    }
    .route-button:hover { background: var(--context); color: var(--ink); }
    .route-button[aria-current="page"] { background: var(--ink); color: var(--elevated); }
    .route-glyph { font-family: var(--font-mono); font-size: 15px; line-height: 1; }
    .rail-note { margin-top: auto; color: var(--muted); font-family: var(--font-mono); font-size: 8px; letter-spacing: .08em; writing-mode: vertical-rl; }

    .route-scroll { min-width: 0; overflow-y: auto; }
    .route-panel { min-height: 100%; padding: clamp(20px, 4vw, 34px); }
    .route-head { display: flex; align-items: end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
    .eyebrow { margin-bottom: 5px; color: var(--muted); font-family: var(--font-mono); font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .route-head h1 { font-size: clamp(25px, 4vw, 34px); line-height: 1.08; }
    .route-copy { max-width: 54ch; margin-top: 7px; color: var(--sub-ink); font-size: 12.5px; }
    .primary-action {
      border: 0;
      border-radius: 12px;
      padding: 9px 14px;
      background: var(--ink);
      color: var(--elevated);
      font-size: 12px;
      font-weight: 750;
    }
    .primary-action:hover { background: var(--sub-ink); }

    .ledger {
      display: flex;
      align-items: end;
      gap: clamp(18px, 4vw, 30px);
      flex-wrap: wrap;
      margin-top: 19px;
      padding-block: 15px;
      border-block: 1px solid var(--line);
    }
    .ledger-cell { display: grid; gap: 3px; }
    .ledger-cell b { font-family: var(--font-mono); font-size: 24px; line-height: 1; }
    .ledger-cell span { color: var(--muted); font-size: 10.5px; }
    .ledger-cell.is-busy b { color: var(--amber); }
    .readiness { margin-top: 10px; color: var(--muted); font-size: 10px; letter-spacing: .03em; }

    .saved-list { display: grid; margin-top: 16px; border-top: 1px solid var(--line); }
    .saved-row {
      width: 100%;
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 12px 8px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
    }
    .saved-row:hover, .saved-row.is-hovered { background: var(--context); }
    .saved-row[aria-expanded="true"] { box-shadow: inset 3px 0 var(--product); background: var(--product-soft); }
    .signal-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .signal-dot.is-busy { background: var(--amber); }
    .signal-dot.is-parked { background: var(--line-strong); }
    .saved-main { min-width: 0; display: grid; gap: 2px; }
    .saved-title { overflow: hidden; color: var(--sub-ink); font-size: 13px; font-weight: 720; text-overflow: ellipsis; white-space: nowrap; }
    .saved-meta { color: var(--muted); font-family: var(--font-mono); font-size: 9.5px; }
    .saved-verdict { color: var(--muted); font-size: 10.5px; font-weight: 750; white-space: nowrap; }
    .saved-reading {
      display: grid;
      gap: 12px;
      padding: 18px 18px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .reading-meta { display: flex; gap: 6px; flex-wrap: wrap; }
    .reading-meta span { padding: 3px 7px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-family: var(--font-mono); font-size: 9px; }
    .saved-reading h2 { font-size: 21px; line-height: 1.2; }
    .reading-summary { color: var(--sub-ink); font-size: 12.5px; line-height: 1.65; }
    .reading-facts { display: grid; gap: 8px; margin: 0; padding-top: 12px; border-top: 1px solid var(--line); }
    .reading-facts div { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 10px; }
    .reading-facts dt { color: var(--muted); font-family: var(--font-mono); font-size: 9px; font-weight: 750; letter-spacing: .05em; }
    .reading-facts dd { margin: 0; color: var(--sub-ink); font-size: 11.5px; }
    .reading-quote { margin: 0; padding-left: 11px; border-left: 2px solid var(--line-strong); font-family: var(--font-serif); font-size: 14px; line-height: 1.6; }

    .action-stage {
      display: grid;
      gap: 14px;
      min-height: 360px;
      margin-top: 18px;
      padding: clamp(20px, 4vw, 30px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 1px 2px var(--line);
    }
    .action-stage.is-forward { animation: stage-forward 220ms ease both; }
    .action-stage.is-backward { animation: stage-backward 220ms ease both; }
    @keyframes stage-forward { from { opacity: .35; transform: translateX(6px); } to { opacity: 1; transform: none; } }
    @keyframes stage-backward { from { opacity: .35; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    .stage-head { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .stage-head span { padding: 3px 7px; border-radius: 8px; background: var(--context); color: var(--muted); font-family: var(--font-mono); font-size: 9px; }
    .stage-head .stage-index { width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--elevated); color: var(--sub-ink); }
    .stage-title { max-width: 24ch; font-size: clamp(27px, 4.8vw, 40px); line-height: 1.08; }
    .stage-summary { max-width: 62ch; color: var(--sub-ink); font-size: 13px; line-height: 1.7; }
    .observation-sequence { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 4px 0 0; padding: 0; list-style: none; }
    .observation-sequence li { position: relative; min-width: 0; padding: 11px; border-radius: 12px; background: var(--context); }
    .observation-sequence li:last-child { background: var(--product-soft); }
    .observation-sequence b { display: block; color: var(--muted); font-family: var(--font-mono); font-size: 9px; letter-spacing: .07em; }
    .observation-sequence span { display: block; margin-top: 7px; color: var(--sub-ink); font-size: 11.5px; line-height: 1.55; }
    .stage-quote { margin: 0; padding: 3px 0 3px 12px; border-left: 2px solid var(--line-strong); color: var(--sub-ink); font-family: var(--font-serif); font-size: 14px; font-style: italic; line-height: 1.65; }
    .stage-quote cite { display: block; margin-top: 4px; color: var(--muted); font-family: var(--font-mono); font-size: 9px; font-style: normal; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 16px; }
    .pager-button { padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--elevated); color: var(--sub-ink); font-size: 11px; font-weight: 700; }
    .pager-button:hover:not(:disabled) { border-color: var(--line-strong); background: var(--context); }
    .pager-dots { display: flex; gap: 2px; }
    .pager-dot { position: relative; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 7px; background: transparent; }
    .pager-dot::before { content: ""; width: 9px; height: 9px; border: 1px solid var(--line-strong); border-radius: 50%; background: var(--elevated); }
    .pager-dot:hover::before { border-color: var(--product); background: var(--context); }
    .pager-dot[aria-current="page"]::before { border-color: var(--product); background: var(--product); }
    .pager-dot::after {
      content: attr(data-tooltip);
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: calc(100% + 7px);
      width: max-content;
      max-width: 210px;
      padding: 5px 7px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--ink);
      color: var(--elevated);
      font-size: 9px;
      font-weight: 650;
      line-height: 1.35;
      text-align: left;
      white-space: normal;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 2px);
      transition: opacity 120ms ease, transform 120ms ease, visibility 120ms ease;
      pointer-events: none;
    }
    .pager-dot:hover::after, .pager-dot:focus-visible::after { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
    .action-live { min-width: 88px; color: var(--muted); font-size: 9px; text-align: center; }
    .exclusion { margin-top: 16px; border-top: 1px solid var(--line); }
    .exclusion summary { padding: 13px 4px; color: var(--muted); cursor: pointer; font-family: var(--font-mono); font-size: 10px; }
    .exclusion summary:hover { color: var(--ink); }
    .excluded-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--line); color: var(--sub-ink); font-size: 11px; }
    .excluded-row span:last-child { color: var(--muted); text-align: right; }

    :is(button, summary, [tabindex]):focus-visible { outline: 3px solid var(--product); outline-offset: 2px; box-shadow: 0 0 0 6px var(--elevated); }
    @media (max-width: 680px) {
      .extension-shell { min-height: 0; border-radius: 16px; }
      .route-panel { padding: 20px 16px 28px; }
      .action-stage { min-height: 0; }
    }
    @media (max-width: 480px) {
      .saved-row { grid-template-columns: 9px minmax(0, 1fr); }
      .saved-verdict { grid-column: 2; }
      .reading-facts div { grid-template-columns: 1fr; gap: 3px; }
      .pager { display: grid; grid-template-columns: auto 1fr auto; }
      .pager-dots { justify-self: center; }
      .action-live { grid-row: 2; grid-column: 1 / -1; justify-self: center; }
      .excluded-row { grid-template-columns: 1fr; }
      .excluded-row span:last-child { text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      .action-stage.is-forward, .action-stage.is-backward { animation: none !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <main class="extension-shell" data-extension-shell>
    <aside class="route-rail" aria-label="Product 路徑">
      <div class="brand-mark" aria-label="DLens">D</div>
      <nav class="route-nav" aria-label="Product 工作區">
        <button class="route-button" type="button" data-route-button="saved">
          <span class="route-glyph" aria-hidden="true">▤</span><span>已存</span>
        </button>
        <button class="route-button" type="button" data-route-button="action" aria-current="page">
          <span class="route-glyph" aria-hidden="true">→</span><span>行動</span>
        </button>
      </nav>
      <span class="rail-note">PRODUCT · REFIT B</span>
    </aside>

    <div class="route-scroll">
      <section class="route-panel" data-route-panel="saved" data-od-id="saved-signals-route" hidden>
        <header class="route-head">
          <div>
            <p class="eyebrow">Saved signals · 7</p>
            <h1>已存訊號</h1>
            <p class="route-copy">逐則閱讀已保存的來源；抓取或分析缺口保持可見。</p>
          </div>
          <button class="primary-action" type="button">重新分析</button>
        </header>
        <div class="ledger" aria-label="覆蓋率帳本">
          <div class="ledger-cell"><b data-analyzed-count>6/7</b><span>已分析</span></div>
          <div class="ledger-cell"><b data-classified-count>6/6</b><span>AI 已分類</span></div>
          <div class="ledger-cell is-busy"><b data-crawling-count>1</b><span>補爬中</span></div>
        </div>
        <p class="readiness mono">AI key · ProductProfile · ProductContext 已就緒 · 1 則正在補爬</p>
        <div class="saved-list" data-saved-list aria-label="七則已存訊號"></div>
      </section>

      <section class="route-panel" data-route-panel="action" data-od-id="action-stage-route" tabindex="0" aria-label="候選行動分頁；可用左右方向鍵、Home 與 End 操作">
        <header class="route-head">
          <div>
            <p class="eyebrow">Candidate actions · 4</p>
            <h1>一次一則，整理下一步</h1>
            <p class="route-copy">只呈現保留觀察的訊號；沒有 fixture 支持的分析不補寫。</p>
          </div>
        </header>
        <article class="action-stage" data-action-stage aria-live="polite"></article>
        <div class="pager" aria-label="候選行動分頁">
          <button class="pager-button" type="button" data-pager="prev">← 上一則</button>
          <div class="pager-dots">
            <button class="pager-dot" type="button" data-action-dot="0" data-tooltip="介面微互動的節制應用原則" aria-label="第 1 則：介面微互動的節制應用原則" aria-current="page"></button>
            <button class="pager-dot" type="button" data-action-dot="1" data-tooltip="AI 驅動的快速原型開發流程" aria-label="第 2 則：AI 驅動的快速原型開發流程"></button>
            <button class="pager-dot" type="button" data-action-dot="2" data-tooltip="透過嚴格 JSON 協定降低模型依賴" aria-label="第 3 則：透過嚴格 JSON 協定降低模型依賴"></button>
            <button class="pager-dot" type="button" data-action-dot="3" data-tooltip="數據呈現的環境變數過濾" aria-label="第 4 則：數據呈現的環境變數過濾"></button>
          </div>
          <span class="action-live mono" data-action-live>1 / 4</span>
          <button class="pager-button" type="button" data-pager="next">下一則 →</button>
        </div>
        <details class="exclusion">
          <summary>前提不符 · 2 則（展開查看）</summary>
          <div class="excluded-row"><span>AI 程式碼除錯的信任門檻</span><span>用戶情緒抒發,缺乏可操作脈絡</span></div>
          <div class="excluded-row"><span>無直接產品參考價值</span><span>缺乏技術細節與實作脈絡</span></div>
        </details>
      </section>
    </div>
  </main>

  <script>
    const SIGNALS = Object.freeze([
      { id: "r1", title: "介面微互動的節制應用原則", type: "learning", relevance: 2, likes: 224, replies: 5, reposts: 23, shares: 158, engagement: 410, verdict: "watch", status: "analyzed", summary: "最近看到一個滿適合做產品細節的工具：Icon Animator…", reason: "此訊號探討 UI 互動的細節處理，對提升產品介面質感與用戶體驗有參考價值。", takeaway: "動態效果僅在 hover 或互動引導時觸發。", quote: "我覺得hover或是新功能上線後吸引人注意,但不能用太多", evidence: "e8" },
      { id: "r2", title: "vibe coding 我开发了一个看得见 Wi-Fi 信号强…", type: null, relevance: null, likes: null, replies: null, reposts: null, shares: null, engagement: null, verdict: null, status: "crawling" },
      { id: "r3", title: "AI 驅動的快速原型開發流程", type: "learning", relevance: 2, likes: 47, replies: 5, reposts: 2, shares: 24, engagement: 78, verdict: "watch", status: "analyzed", summary: null, reason: null, takeaway: null, quote: null, evidence: null },
      { id: "r4", title: "AI 程式碼除錯的信任門檻", type: "noise", relevance: 1, likes: 68, replies: 21, reposts: null, shares: 3, engagement: 92, verdict: "park", status: "analyzed", reason: "用戶情緒抒發,缺乏可操作脈絡" },
      { id: "r5", title: "透過嚴格 JSON 協定降低模型依賴", type: "technical", relevance: 3, likes: 17, replies: 25, reposts: 2, shares: 5, engagement: 49, verdict: "watch", status: "analyzed", summary: null, reason: null, takeaway: null, quote: null, evidence: null },
      { id: "r6", title: "無直接產品參考價值", type: "noise", relevance: 1, likes: null, replies: null, reposts: null, shares: null, engagement: null, verdict: "park", status: "analyzed", reason: "缺乏技術細節與實作脈絡" },
      { id: "r7", title: "數據呈現的環境變數過濾", type: "technical", relevance: 2, likes: null, replies: null, reposts: null, shares: null, engagement: null, verdict: "watch", status: "analyzed", summary: null, reason: null, takeaway: null, quote: null, evidence: null, sourceGap: "來源對應未確認；不冒領既有 Wi-Fi 文案。" }
    ]);
    const ACTION_SIGNAL_IDS = Object.freeze(["r1", "r3", "r5", "r7"]);
    const actionSignals = ACTION_SIGNAL_IDS.map((id) => SIGNALS.find((signal) => signal.id === id));
    const state = { route: "action", savedSignalId: "r1", actionSignalId: "r1", actionDirection: 0 };
    const unavailableSummary = "來源摘要未隨 fixture 提供；不補寫推論。";
    const unavailableReason = "觀察原因未隨 fixture 提供。";
    const unavailableTakeaway = "新知未隨 fixture 提供；不由標題推論。";
    const noTask = "尚未有可派發任務；先保留為觀察。";

    function signalById(signalId) {
      return SIGNALS.find((signal) => signal.id === signalId) || null;
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
    }

    function typeLabel(type) {
      return type === "learning" ? "學習資源" : type === "technical" ? "技術討論" : type === "noise" ? "噪音" : "未分析";
    }

    function verdictLabel(signal) {
      if (signal.status === "crawling") return "抓取中";
      return signal.verdict === "watch" ? "保留觀察" : "前提不符";
    }

    function readinessLabel(signal) {
      return signal.status === "analyzed" ? "可分析" : "補爬中";
    }

    function metric(value) {
      return value == null ? "未讀" : String(value);
    }

    function metricSummary(signal) {
      return `讚 ${metric(signal.likes)} · 回覆 ${metric(signal.replies)} · 轉發 ${metric(signal.reposts)} · 分享 ${metric(signal.shares)} · 總互動 ${metric(signal.engagement)}`;
    }

    function sourceSummary(signal) {
      if (signal.status === "crawling") return "抓取尚未完成；不生成分析內容。";
      return signal.summary || signal.sourceGap || unavailableSummary;
    }

    function setRoute(route) {
      if (route !== "saved" && route !== "action") return;
      state.route = route;
      document.querySelectorAll("[data-route-panel]").forEach((panel) => {
        panel.hidden = panel.dataset.routePanel !== route;
      });
      document.querySelectorAll("[data-route-button]").forEach((button) => {
        if (button.dataset.routeButton === route) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
    }

    function renderSavedReading(signalId) {
      const signal = signalById(signalId);
      if (!signal) return "";
      const reasonLabel = signal.verdict === "park" ? "排除原因" : "觀察原因";
      const reason = signal.status === "crawling" ? "抓取尚未完成。" : signal.reason || unavailableReason;
      const takeaway = signal.status === "crawling" ? "抓取完成前不可用。" : signal.takeaway || unavailableTakeaway;
      const quote = signal.quote ? `<blockquote class="reading-quote">「${escapeHTML(signal.quote)}」</blockquote>` : "";
      return `<article class="saved-reading" id="saved-reading-${signal.id}" data-saved-reading="${signal.id}">
        <div class="reading-meta"><span>${escapeHTML(verdictLabel(signal))}</span><span>${escapeHTML(readinessLabel(signal))}</span><span>${escapeHTML(typeLabel(signal.type))}</span></div>
        <h2>${escapeHTML(signal.title)}</h2>
        <p class="reading-summary">${escapeHTML(sourceSummary(signal))}</p>
        ${quote}
        <dl class="reading-facts">
          <div><dt>${reasonLabel}</dt><dd>${escapeHTML(reason)}</dd></div>
          <div><dt>新知保留</dt><dd>${escapeHTML(takeaway)}</dd></div>
          <div><dt>來源真相</dt><dd class="mono">${escapeHTML(signal.evidence || "證據 ref 未提供")} · ${escapeHTML(metricSummary(signal))}</dd></div>
        </dl>
      </article>`;
    }

    function renderSavedRoute() {
      const list = document.querySelector("[data-saved-list]");
      list.innerHTML = SIGNALS.map((signal) => {
        const selected = signal.id === state.savedSignalId;
        const relevance = signal.relevance == null ? "參考度未讀" : `參考度 ${signal.relevance}/5`;
        const dotClass = signal.status === "crawling" ? "is-busy" : signal.verdict === "park" ? "is-parked" : "";
        const row = `<button class="saved-row" type="button" data-saved-row="${signal.id}" aria-expanded="${selected}"${selected ? ` aria-controls="saved-reading-${signal.id}"` : ""}>
          <i class="signal-dot ${dotClass}" aria-hidden="true"></i>
          <span class="saved-main"><span class="saved-title">${escapeHTML(signal.title)}</span><span class="saved-meta">${escapeHTML(typeLabel(signal.type))} · ${relevance} · 總互動 ${metric(signal.engagement)}</span></span>
          <span class="saved-verdict">${escapeHTML(verdictLabel(signal))}</span>
        </button>`;
        return selected ? row + renderSavedReading(signal.id) : row;
      }).join("");

      list.querySelectorAll("[data-saved-row]").forEach((row) => {
        row.addEventListener("pointerenter", () => row.classList.add("is-hovered"));
        row.addEventListener("pointerleave", () => row.classList.remove("is-hovered"));
        row.addEventListener("click", () => {
          state.savedSignalId = row.dataset.savedRow;
          renderSavedRoute();
          document.querySelector(`[data-saved-row="${state.savedSignalId}"]`)?.focus();
        });
      });
    }

    function renderActionStage(signalId, direction) {
      const signal = signalById(signalId);
      if (!signal || !ACTION_SIGNAL_IDS.includes(signal.id)) return;
      state.actionSignalId = signal.id;
      state.actionDirection = direction;
      const index = ACTION_SIGNAL_IDS.indexOf(signal.id);
      const stage = document.querySelector("[data-action-stage]");
      const quote = signal.quote
        ? `<blockquote class="stage-quote">「${escapeHTML(signal.quote)}」<cite>${escapeHTML(signal.evidence || "證據 ref 未提供")}</cite></blockquote>`
        : "";
      stage.classList.remove("is-forward", "is-backward");
      stage.innerHTML = `<header class="stage-head">
          <span class="stage-index">${index + 1}</span>
          <span>${escapeHTML(verdictLabel(signal))}</span>
          <span>${escapeHTML(readinessLabel(signal))}</span>
          <span>${escapeHTML(typeLabel(signal.type))}</span>
        </header>
        <h2 class="stage-title">${escapeHTML(signal.title)}</h2>
        <p class="stage-summary">${escapeHTML(sourceSummary(signal))}</p>
        <ol class="observation-sequence">
          <li><b>觀察原因</b><span>${escapeHTML(signal.reason || unavailableReason)}</span></li>
          <li><b>新知保留</b><span>${escapeHTML(signal.takeaway || unavailableTakeaway)}</span></li>
          <li><b>下一步</b><span>${noTask}</span></li>
        </ol>
        ${quote}`;
      void stage.offsetWidth;
      if (direction > 0) stage.classList.add("is-forward");
      if (direction < 0) stage.classList.add("is-backward");
    }

    function renderActionPager() {
      const index = ACTION_SIGNAL_IDS.indexOf(state.actionSignalId);
      document.querySelector('[data-pager="prev"]').disabled = index === 0;
      document.querySelector('[data-pager="next"]').disabled = index === ACTION_SIGNAL_IDS.length - 1;
      document.querySelectorAll("[data-action-dot]").forEach((dot) => {
        if (Number(dot.dataset.actionDot) === index) dot.setAttribute("aria-current", "page");
        else dot.removeAttribute("aria-current");
      });
      document.querySelector("[data-action-live]").textContent = `${index + 1} / ${ACTION_SIGNAL_IDS.length} · ${actionSignals[index].title}`;
    }

    function goToActionIndex(index) {
      const currentIndex = ACTION_SIGNAL_IDS.indexOf(state.actionSignalId);
      const boundedIndex = Math.max(0, Math.min(ACTION_SIGNAL_IDS.length - 1, index));
      const direction = Math.sign(boundedIndex - currentIndex);
      renderActionStage(ACTION_SIGNAL_IDS[boundedIndex], direction);
      renderActionPager();
    }

    document.querySelectorAll("[data-route-button]").forEach((button) => {
      button.addEventListener("click", () => setRoute(button.dataset.routeButton));
    });
    document.querySelector('[data-pager="prev"]').addEventListener("click", () => goToActionIndex(ACTION_SIGNAL_IDS.indexOf(state.actionSignalId) - 1));
    document.querySelector('[data-pager="next"]').addEventListener("click", () => goToActionIndex(ACTION_SIGNAL_IDS.indexOf(state.actionSignalId) + 1));
    document.querySelectorAll("[data-action-dot]").forEach((dot) => {
      dot.addEventListener("click", () => goToActionIndex(Number(dot.dataset.actionDot)));
    });
    const actionPanel = document.querySelector('[data-route-panel="action"]');
    actionPanel.addEventListener("keydown", (event) => {
      if (event.target !== actionPanel) return;
      const currentIndex = ACTION_SIGNAL_IDS.indexOf(state.actionSignalId);
      const nextIndex = event.key === "ArrowLeft" ? currentIndex - 1
        : event.key === "ArrowRight" ? currentIndex + 1
          : event.key === "Home" ? 0
            : event.key === "End" ? ACTION_SIGNAL_IDS.length - 1
              : null;
      if (nextIndex === null) return;
      event.preventDefault();
      goToActionIndex(nextIndex);
    });

    const analyzedSignals = SIGNALS.filter((signal) => signal.status === "analyzed");
    document.querySelector("[data-analyzed-count]").textContent = `${analyzedSignals.length}/${SIGNALS.length}`;
    document.querySelector("[data-classified-count]").textContent = `${analyzedSignals.length}/${analyzedSignals.length}`;
    document.querySelector("[data-crawling-count]").textContent = String(SIGNALS.filter((signal) => signal.status === "crawling").length);
    renderSavedRoute();
    renderActionStage(state.actionSignalId, state.actionDirection);
    renderActionPager();
    setRoute(state.route);

    window.__productRefitB = Object.freeze({
      setRoute,
      renderSavedRoute,
      renderSavedReading,
      renderActionStage,
      goToActionIndex,
      getState: () => ({ ...state })
    });
  </script>
</body>
</html>
