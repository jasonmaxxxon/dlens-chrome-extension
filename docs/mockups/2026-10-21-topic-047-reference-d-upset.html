<style>
:root{--ink:#1b1a17;--sub:#3d3b35;--soft:#6c695e;--hair:rgba(27,26,23,.12);--sage:#3f5a3b;--wash:#eff4ec;--paper:#fbfbf9;--stage:#e9e7e1;--sans:-apple-system,BlinkMacSystemFont,'PingFang TC',system-ui,sans-serif;--serif:'Songti TC',serif}*{box-sizing:border-box}body{margin:0;background:var(--stage);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--sage);outline-offset:3px}[hidden]{display:none!important}.intro,.foot{max-width:660px;margin:24px auto;padding:0 20px}.intro small{font-size:11px;color:var(--soft);letter-spacing:.06em}.intro h1{font-size:23px;margin:6px 0}.intro p,.foot{font-size:12px;color:var(--soft);margin-top:5px}a{color:var(--sage);text-underline-offset:3px}.surface{width:328px;max-width:100%;margin:0 auto 28px;background:var(--paper);border:1px solid var(--hair);border-radius:12px;overflow:hidden}.chrome{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#f6f4f0;font-size:12px;border-bottom:1px solid var(--hair)}.chrome span+span{font-size:11px;color:var(--soft)}.nav{height:43px;display:flex;align-items:center;gap:22px;padding:0 15px;border-bottom:1px solid var(--hair);font-size:13px;color:var(--soft)}.nav b{height:100%;display:flex;align-items:center;border-bottom:2px solid var(--sage);font-weight:600;color:var(--sage)}.body{padding:16px 14px 24px;min-width:0}.crumb{font-size:11px;color:var(--soft);margin:0 0 6px}h2{font:600 21px/1.4 var(--serif);margin:0 0 7px}.coverage{font-size:11px;color:var(--soft);margin:0 0 19px}.module-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.module-head b{font-size:14px;font-weight:600}.quiet{font-size:11.5px;color:var(--sage);min-height:34px;padding:4px 0}.hint{font-size:11.5px;color:var(--soft);line-height:1.65;margin:5px 0 12px}.plot{display:grid;grid-template-columns:45% minmax(0,1fr);gap:6px;--row:96px;--bar:92px}.axis-head{height:var(--bar);font-size:10.5px;color:var(--soft);display:flex;align-items:flex-end;padding-bottom:12px;line-height:1.6}.source-name{height:var(--row);display:flex;flex-direction:column;justify-content:center;padding:7px 9px 7px 0;border-top:1px solid var(--hair);overflow-wrap:anywhere}.source-name b{font-size:12px;line-height:1.6;font-weight:500}.source-name small{font-size:10px;color:var(--soft);line-height:1.5;margin-top:5px}.combinations{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;min-width:0}.combination{position:relative;border-radius:8px;padding:0;display:flex;flex-direction:column;min-width:0;border:1px solid transparent}.combination[aria-pressed=true]{background:var(--wash);border-color:rgba(63,90,59,.24)}.combination:hover{background:var(--wash)}.bar-area{height:calc(var(--bar) - 1px);display:flex;align-items:center;justify-content:flex-end;flex-direction:column;padding:8px 3px 12px;border-bottom:1px solid var(--hair)}.bar-area strong{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;line-height:20px}.bar{display:block;width:19px;max-width:80%;height:calc(var(--ratio)*48px);min-height:4px;background:#c7cebf;border-radius:3px 3px 0 0}.combination[aria-pressed=true] .bar{background:var(--sage)}.cells{position:relative;width:100%}.stem{position:absolute;width:1px;background:#b4bdaa;left:50%;top:calc(var(--first)*var(--row) + var(--row)/2);height:calc((var(--last) - var(--first))*var(--row))}.combination[aria-pressed=true] .stem{background:var(--sage)}.cell{height:var(--row);border-top:1px solid var(--hair);display:grid;place-items:center;position:relative;z-index:1}.dot{width:7px;height:7px;border-radius:50%;background:#e1e3dc;outline:4px solid var(--paper)}.dot.member{width:11px;height:11px;background:#6c795f}.combination[aria-pressed=true] .dot{outline-color:var(--wash)}.combination[aria-pressed=true] .dot.member{background:var(--sage)}.column-caption{padding:8px 2px;font-size:10px;color:var(--soft);line-height:1.5;text-align:center;min-height:31px}.selection{margin-top:15px;border-top:1px solid var(--hair);padding-top:14px}.selection h3{font-size:14px;margin:0 0 4px;line-height:1.6}.selection .people{font-size:11px;line-height:1.6;color:var(--soft);margin:0 0 11px;overflow-wrap:anywhere}.point{border-top:1px solid var(--hair)}.point-toggle{width:100%;display:flex;align-items:flex-start;gap:8px;padding:12px 0;text-align:left;min-height:44px;font-size:13px;line-height:1.6}.point-toggle span{flex:1}.point-toggle i{font-style:normal;color:var(--sage)}.point-toggle[aria-expanded=true]{color:var(--sage)}.quotes{display:grid;gap:9px;margin-bottom:12px}.quote{border:1px solid var(--hair);border-radius:9px;background:#fff;padding:10px 11px}.quote header{font-size:10.5px;color:var(--soft);display:flex;gap:8px;justify-content:space-between}.quote header time{white-space:nowrap}.quote p{font-size:11.5px;color:var(--sub);margin:5px 0 9px;line-height:1.6}.quote blockquote{border-left:2px solid var(--sage);padding-left:9px;margin:0;font-size:13px;line-height:1.7}.quote small{font-size:10px;color:var(--soft);display:block;margin-top:6px}.note{font-size:10.5px;color:var(--soft);margin:13px 0 0}.picker{margin:8px 0 16px;padding:11px;border:1px solid var(--hair);background:#fff;border-radius:9px}.picker p{font-size:11.5px;color:var(--soft);margin:0 0 8px}.presets{display:flex;gap:6px;margin-bottom:8px}.presets button{border:1px solid var(--hair);border-radius:6px;min-height:30px;padding:4px 7px;font-size:11px;color:var(--sage)}.pick-list{max-height:260px;overflow:auto}.pick-list label{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:12px;line-height:1.55}.pick-list input{accent-color:var(--sage);margin:4px 0 0;flex:none}.pick-list small{display:block;font-size:10px;color:var(--soft);margin-top:2px}.picker .notice{font-size:11px;min-height:18px;margin:8px 0}.pick-actions{display:flex;justify-content:flex-end;gap:7px}.pick-actions button{border:1px solid var(--hair);border-radius:6px;min-height:32px;font-size:11.5px;padding:4px 9px}.pick-actions .apply{background:var(--sage);color:#fff}.pick-actions button:disabled{opacity:.4;cursor:default}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.embed body{background:var(--paper)}.embed .intro,.embed .foot{display:none}.embed .surface{width:100%;margin:0;border:0;border-radius:0}@media(max-width:360px){.intro,.foot{padding:0 12px}.surface{border-radius:0}}@media(prefers-reduced-motion:no-preference){.combination{transition:background .15s,border-color .15s}}
</style></head><body>
<header class="intro"><small>DLENS / REFERENCE D</small><h1>D · 交集選取</h1><p>參考 <a href="https://upset.js.org/integrations/r/articles/upsetjs.html#basic-user-interface" target="_blank" rel="noreferrer">UpSet.js</a> 的交集組合與聯動選取。每欄表示一組帖子共同被哪些重點引用。</p><p>試試點上方長條，再點一個重點看跨帖原句；「換帖」可改成另一組文章。</p></header>
<main class="surface" id="app"></main><footer class="foot">獨立互動示意，全部資料虛構。借用交集選取方式，並非 UpSet.js 產品畫面的複製。</footer>
<script>
'use strict';
const posts=[
 {id:'A',handle:'office.mei',date:'2026-09-02',title:'公司話唔准用 ChatGPT，但個個都用緊',replies:412},
 {id:'B',handle:'devlam',date:'2026-09-05',title:'寫 code 快咗一倍，但 review 辛苦咗',replies:230},
 {id:'C',handle:'cs_kiki',date:'2026-09-11',title:'客服部已經裁咗一半人',replies:388},
 {id:'D',handle:'hr.notes',date:'2026-09-12',title:'HR 角度：我哋點睇員工用 AI',replies:156},
 {id:'E',handle:'design.wo',date:'2026-09-20',title:'設計師唔驚，驚嘅係唔識用嘅人',replies:274},
 {id:'F',handle:'acct_sam',date:'2026-09-26',title:'會計部用 AI 對數，老闆唔知',replies:198},
 {id:'G',handle:'law.pp',date:'2026-10-01',title:'律師行全面禁用，原因係保密',replies:142},
 {id:'H',handle:'newgrad.j',date:'2026-10-03',title:'畢業生：見工被問識唔識 prompt',replies:351},
 {id:'I',handle:'pm.yan',date:'2026-10-09',title:'會議紀錄全部交俾 AI',replies:120},
 {id:'J',handle:'it.sec',date:'2026-10-12',title:'IT 部：偷偷用 AI 係資料外洩風險',replies:265},
 {id:'K',handle:'teacher.c',date:'2026-10-16',title:'學校老師用 AI 出卷',replies:180,pending:true},
 {id:'L',handle:'cs_lok',date:'2026-10-18',title:'客服仲有冇得做？',replies:230,pending:true}
];
const points=[
 {id:'private',label:'員工私下用 AI，公司政策有鬆有緊',short:'私下使用與公司政策',hits:{A:'公司 IT 封咗網址，我哋用手機開。',F:'老闆唔知我用 AI 對數，快咗兩粒鐘。',I:'冇人講過可唔可以，大家就照用。',D:'我哋 HR 都未有政策，係最近先開始傾。'}},
 {id:'privacy',label:'資料保密是禁用或收緊使用的原因',short:'資料保密的限制',hits:{G:'客戶資料一入 AI 就係違約，所以全面禁。',J:'上個月有同事將合約貼入去，即刻要報告。',A:'我哋公司都係因為呢個原因封網。'}},
 {id:'writing',label:'AI 已用於電郵、會議紀錄與工作文件',short:'電郵、紀錄與文件',hits:{I:'每次開完會錄音丟入去，十分鐘有紀錄。',A:'寫 email 俾老闆用嚟潤色。',B:'寫 commit message 同文件。',F:'用嚟寫對數報告嘅說明。'}},
 {id:'jobs',label:'職位取代的壓力，出現在裁員、求職與技能要求',short:'職位與技能壓力',hits:{C:'我哋組由 12 個減到 6 個。',H:'見工時人哋話「呢啲 AI 做得到」。',E:'驚嘅唔係設計師，係只識跟稿嗰啲。'}},
 {id:'review',label:'程式與設計使用 AI 後，仍需人工檢查和修改',short:'初稿之後的人工工作',hits:{B:'快咗，但 review 時間多咗。',E:'我用 AI 出初稿，之後自己改。'}}
];


const byId=new Map(posts.map(p=>[p.id,p])),included=posts.filter(p=>!p.pending),pointById=new Map(points.map(p=>[p.id,p]));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateLabel=d=>`${Number(d.slice(5,7))}月${Number(d.slice(8))}日`;
const state={visible:['A','F','I'],active:null,point:null,picker:false,draft:[],notice:''};
function combinations(){
 const map=new Map();
 for(const point of points){const members=state.visible.filter(id=>Object.hasOwn(point.hits,id));if(!members.length)continue;const key=members.join('-');const group=map.get(key)||{key,members,points:[]};group.points.push(point);map.set(key,group);}
 return [...map.values()].sort((a,b)=>b.members.length-a.members.length||b.points.length-a.points.length||a.key.localeCompare(b.key));
}
function groupLabel(group){return group.members.length===state.visible.length?`${group.members.length} 篇共有`:group.members.length===1?'單篇引用':`${group.members.length} 篇共有`;}
function picker(){if(!state.picker)return '';return `<section class="picker" aria-label="選擇比較帖子"><p>選 2–4 篇。交集只按目前選擇的帖子計算。</p><div class="presets"><button data-action="preset" data-preset="policy" data-focus="preset-policy">政策與文書</button><button data-action="preset" data-preset="work" data-focus="preset-work">工作與技能</button></div><div class="pick-list">${included.map(p=>`<label><input type="checkbox" data-pick="${p.id}" data-focus="pick-${p.id}" ${state.draft.includes(p.id)?'checked':''}><span>${esc(p.title)}<small>@${esc(p.handle)} · ${dateLabel(p.date)}</small></span></label>`).join('')}</div><p class="notice" role="status">${esc(state.notice||`已選 ${state.draft.length} 篇`)}</p><div class="pick-actions"><button data-action="cancel" data-focus="cancel">取消</button><button class="apply" data-action="apply" data-focus="apply" ${state.draft.length<2||state.draft.length>4?'disabled':''}>套用 ${state.draft.length} 篇</button></div></section>`;}
function plot(groups){const max=Math.max(...groups.map(g=>g.points.length));return `<div class="plot" aria-label="帖子引用交集"><div class="source-axis"><div class="axis-head">帖題<br>右側實點＝該欄包含這篇</div>${state.visible.map(id=>{const p=byId.get(id);return `<div class="source-name" data-source="${id}"><b>${esc(p.title)}</b><small>@${esc(p.handle)}</small></div>`;}).join('')}</div><div class="combinations" style="--n:${groups.length}">${groups.map(g=>{
 const memberRows=g.members.map(id=>state.visible.indexOf(id)),selected=g.key===state.active;
 return `<button class="combination" data-action="group" data-key="${g.key}" data-focus="group-${g.key}" aria-pressed="${selected}" aria-label="${g.members.map(id=>'@'+byId.get(id).handle).join('、')} 共同被 ${g.points.length} 個重點引用，${groupLabel(g)}"><span class="bar-area"><strong>${g.points.length}</strong><span class="bar" style="--ratio:${g.points.length/max}"></span></span><span class="cells"><i class="stem" style="--first:${Math.min(...memberRows)};--last:${Math.max(...memberRows)}" aria-hidden="true"></i>${state.visible.map(id=>`<span class="cell" aria-hidden="true"><i class="dot ${g.members.includes(id)?'member':''}"></i></span>`).join('')}</span><span class="column-caption">${groupLabel(g)}</span></button>`;
 }).join('')}</div></div>`;}
function quote(point,id){const p=byId.get(id);return `<article class="quote"><header><span>來源帖 @${esc(p.handle)}</span><time datetime="${p.date}">${dateLabel(p.date)}</time></header><p>${esc(p.title)}</p><blockquote>${esc(point.hits[id])}</blockquote><small>留言節錄 · 作者未提供</small></article>`;}
function selection(groups){const group=groups.find(g=>g.key===state.active);if(!group)return '';return `<section class="selection" aria-label="交集內容"><h3>${group.members.length>1?`這 ${group.members.length} 篇共有 ${group.points.length} 個引用重點`:`這 ${group.points.length} 個重點只引用了所選的一篇`}</h3><p class="people">${group.members.map(id=>'@'+esc(byId.get(id).handle)).join(' · ')}</p>${group.points.map(p=>`<article class="point"><button class="point-toggle" data-action="point" data-id="${p.id}" data-focus="point-${p.id}" aria-expanded="${state.point===p.id}" aria-controls="quotes-${p.id}"><span>${esc(p.label)}</span><i aria-hidden="true">${state.point===p.id?'−':'＋'}</i></button><div id="quotes-${p.id}" ${state.point===p.id?'':'hidden'}>${state.point===p.id?`<p class="hint">這個重點在整份解讀引用 ${Object.keys(p.hits).length} 篇；以下是所選 ${group.members.length} 篇。</p><div class="quotes">${group.members.map(id=>quote(p,id)).join('')}</div>`:''}</div></article>`).join('')}</section>`;}
function render(focus){const groups=combinations();if(!groups.some(g=>g.key===state.active))state.active=groups[0]?.key??null;document.getElementById('app').innerHTML=`<div class="chrome"><span>DLens</span><span>側欄</span></div><div class="nav"><span>收藏</span><b>工作區</b></div><div class="body"><p class="crumb">觀眾反應 / 話題</p><h2>返工用 AI 工具</h2><p class="coverage">本次解讀 ${included.length} / ${posts.length} 篇 · ${posts.length-included.length} 篇待預讀</p><div class="module-head"><b>共同被哪些重點引用？</b><button class="quiet" data-action="picker" data-focus="picker" aria-expanded="${state.picker}">${state.picker?'收起':'換帖'}</button></div><p class="hint">比較 ${state.visible.length} 篇 · 每欄是一個引用組合<br>上方長條＝該組合的重點數</p>${picker()}${plot(groups)}${selection(groups)}<p class="note">虛構資料示意。只描述這次解讀的引用關係；未被引用仍可能談到同一件事。</p></div>`;if(focus)document.querySelector(`[data-focus="${CSS.escape(focus)}"]`)?.focus({preventScroll:true});}
document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;let focus=b.dataset.focus;switch(b.dataset.action){case'group':state.active=b.dataset.key;state.point=null;break;case'point':state.point=state.point===b.dataset.id?null:b.dataset.id;break;case'picker':state.picker=!state.picker;state.draft=[...state.visible];state.notice='';break;case'cancel':state.picker=false;focus='picker';break;case'preset':state.draft=b.dataset.preset==='policy'?['A','F','I']:['B','C','E','H'];state.notice='';break;case'apply':if(state.draft.length<2||state.draft.length>4)return;state.visible=posts.filter(p=>state.draft.includes(p.id)).map(p=>p.id);state.active=null;state.point=null;state.picker=false;focus='picker';break;}render(focus);});
document.getElementById('app').addEventListener('change',e=>{const input=e.target.closest('input[data-pick]');if(!input)return;if(input.checked&&state.draft.length===4){state.notice='最多 4 篇，先取消一篇再加入。';}else{state.draft=input.checked?[...state.draft,input.dataset.pick]:state.draft.filter(id=>id!==input.dataset.pick);state.notice='';}const top=document.querySelector('.pick-list').scrollTop;render(`pick-${input.dataset.pick}`);document.querySelector('.pick-list').scrollTop=top;});
document.getElementById('app').addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(state.picker){e.preventDefault();state.picker=false;render('picker');}else if(state.point){e.preventDefault();const id=state.point;state.point=null;render(`point-${id}`);}});
render();
</script></body></html>
