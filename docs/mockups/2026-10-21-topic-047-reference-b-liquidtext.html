width:100%;font-size:12px;height:36px;border:1px solid var(--hair);border-radius:7px;padding:0 8px;background:white}.shelf{padding:0 14px 13px}.section-label{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--soft);margin:0 0 7px}.section-label strong{font-size:11px;font-weight:600;color:var(--sub)}.source-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.source{border:1px solid var(--hair);border-radius:6px;background:#fff;min-width:0;position:relative;box-shadow:inset 3px 0 #e4e6dd;padding:6px 6px 5px 10px}.source.highlight{border-color:var(--sage);box-shadow:inset 3px 0 var(--sage);background:var(--sage-w)}.source-title{display:block;padding:0;width:100%;text-align:left;line-height:1.5;font-size:10.5px;min-height:32px;overflow-wrap:anywhere}.source-meta{color:var(--soft);font-size:9px;line-height:1.5;margin:3px 0}.source-bottom{display:flex;justify-content:space-between;align-items:center;gap:4px}.source-bottom span{font-size:9px;color:var(--soft)}.source-bottom button{font-size:10px;color:var(--sage);min-height:28px;white-space:nowrap;border-radius:4px;padding:3px 5px;background:var(--sage-w)}.source-bottom button.on-desk{background:transparent}.desk{border-top:1px solid var(--hair);padding:12px 10px 16px;min-height:225px;background-color:#f2f2eb;background-image:radial-gradient(#cfd2c7 .55px,transparent .55px);background-size:10px 10px}.desk-header{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:5px}.desk-header h3{font-size:12px;margin:0;font-weight:600}.desk-header span{font-size:10px;color:var(--soft)}.desk-hint{font-size:10px;color:var(--soft);margin:0 4px 9px}.desk-tools{display:flex;align-items:center;gap:6px;padding:0 4px;margin:0 0 11px}.desk-tools button{border:1px solid var(--hair);border-radius:5px;padding:4px 8px;min-height:30px;font-size:10px;background:var(--paper);color:var(--sub)}.desk-tools .gather{background:var(--sage);border-color:var(--sage);color:#fff}.desk-tools button:disabled{opacity:.45;cursor:default}.desk-tools .selection-count{font-size:10px;color:var(--soft);margin-right:auto}.slips{display:grid;gap:10px}.slip{width:calc(100% - 15px);position:relative;background:#fff;border:1px solid #d7d9ce;border-radius:3px 10px 8px 3px;padding:9px 11px 7px;box-shadow:1px 3px 5px rgba(27,26,23,.055);overflow-wrap:anywhere;transform:rotate(-.65deg);transform-origin:center}.slip:nth-child(even){margin-left:15px;transform:rotate(.65deg)}.slip::before{content:'';position:absolute;left:-1px;top:11px;bottom:11px;width:3px;background:#b3bcaa;border-radius:2px}.slip.selected{border-color:var(--sage);background:#fbfdf9}.slip.highlight{box-shadow:0 0 0 2px var(--sage);transform:rotate(0)}.slip-top{display:flex;gap:7px;align-items:flex-start;justify-content:space-between}.slip-source{padding:0;text-align:left;min-width:0;color:var(--soft);font-size:9px;line-height:1.5}.slip-source b{display:block;font-size:10px;color:var(--sub);line-height:1.5;font-weight:500;margin:2px 0 4px}.select-slip{flex:none;border:1px solid var(--hair);width:25px;height:25px;border-radius:50%;color:var(--soft);font-size:12px;line-height:1;background:#fff}.slip.selected .select-slip{background:var(--sage);border-color:var(--sage);color:#fff}.slip blockquote{margin:4px 0 7px;font-size:13px;line-height:1.75;color:var(--ink)}.slip-footer{display:flex;align-items:center;justify-content:space-between;gap:3px;border-top:1px solid rgba(27,26,23,.07);padding-top:4px}.slip-footer small{font-size:9px;color:var(--soft)}.slip-footer button{padding:2px 4px;min-height:27px;font-size:10px;color:var(--sage)}.bundle{border:1px solid #aeb8a9;background:rgba(239,244,236,.8);border-radius:9px;padding:8px;position:relative}.bundle-title{font-size:10px;color:var(--sage);margin:0 0 8px}.bundle .slip{width:100%;margin:0;transform:none;box-shadow:none}.bundle .slips{gap:7px}.outside-label{margin:9px 4px;color:var(--soft);font-size:10px}.empty{padding:18px 12px;border:1px dashed #aeb8a9;border-radius:8px;color:var(--soft);font-size:12px;text-align:center}.scope-note{padding:12px 14px;font-size:10px;color:var(--soft);border-top:1px solid var(--hair)}.scope-note p{margin:0 0 5px}.status{font-size:10px;color:var(--sage);min-height:17px;margin:8px 4px 0}.reader{position:absolute;inset:0;z-index:5;background:rgba(27,26,23,.22);display:flex;align-items:flex-start;padding:90px 12px 18px}.reader-card{background:var(--paper);width:100%;padding:15px;border:1px solid var(--hair);border-radius:10px;max-height:700px;overflow:auto;box-shadow:0 10px 35px rgba(27,26,23,.15)}.reader-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--soft);gap:8px}.reader-head button{color:var(--sage);min-height:32px;font-size:11px}.reader h3{font-size:16px;line-height:1.65;margin:12px 0 6px;font-weight:600}.reader-meta{font-size:10px;color:var(--soft);margin:0 0 14px}.reader-quote{padding:10px;border:1px solid var(--hair);border-radius:7px;margin:8px 0;background:#fff}.reader-quote.current{border-color:var(--sage);background:var(--sage-w)}.reader-quote p{font-size:10px;color:var(--soft);margin:0 0 4px}.reader-quote blockquote{margin:0;font-size:13px;line-height:1.8}.reader-quote small{font-size:9px;color:var(--soft)}.reader .back-to-slip{padding:4px 0;color:var(--sage);font-size:11px;min-height:32px}.reader-boundary{font-size:10px;color:var(--soft);margin:14px 0 0}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}body.embed{background:var(--paper)}body.embed .intro,body.embed .foot{display:none}body.embed .surface{width:100%;height:100dvh;border:0;border-radius:0;margin:0}@media(max-width:350px){body:not(.embed) .surface{border-radius:0}.intro,.foot{padding:0 14px}.source-title{font-size:10.5px}}@media(prefers-reduced-motion:no-preference){.slip,.source{transition:background .15s,border-color .15s,box-shadow .15s,transform .15s}.slip.new{animation:extract .22s ease-out}@keyframes extract{from{opacity:.4;translate:0 -8px}to{opacity:1;translate:0 0}}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body>
<header class="intro"><div class="eyebrow">DLENS · 跨帖閱讀參考</div><h1>B · 原句工作台</h1><p>先選重點，從來源抽出原句，再把想比較的節錄聚攏。</p><p>參考 <a href="https://www.liquidtext.net/liquidtextadeeperdive" target="_blank" rel="noopener noreferrer">LiquidText：節錄與來源保持連結 ↗</a></p></header>
<main class="surface" id="app" aria-label="原句工作台"></main>
<footer class="foot"><p>虛構資料與獨立互動稿。只呈現本次解讀的引用，不推斷立場或因果；未接資料儲存或 AI。</p></footer>
<script>
'use strict';
const posts=[
 {id:'A',handle:'office.mei',date:'2026-09-02',title:'公司話唔准用 ChatGPT，但個個都用緊',replies:412},
 {id:'B',handle:'devlam',date:'2026-09-05',title:'寫 code 快咗一倍，但 review 辛苦咗',replies:230},
 {id:'C',handle:'cs_kiki',date:'2026-09-11',title:'客服部已經裁咗一半人',replies:388},
 {id:'D',handle:'hr.notes',date:'2026-09-12',title:'HR 角度：我哋點睇員工用 AI',replies:156},
 {id:'E',handle:'design.wo',date:'2026-09-20',title:'設計師唔驚，驚嘅係唔識用嘅人',replies:274},
 {id:'F',handle:'acct_sam',date:'2026-09-26',title:'會計部用 AI 對數，老闆唔知',replies:198},
 {id:'G',handle:'law.pp',date:'2026-10-01',title:'律師行全面禁用，原因係保密',replies:142},
 {id:'H',handle:'newgrad.j',date:'2026-10-03',title:'畢業生：見工被問識唔識 prompt',replies:351},
 {id:'I',handle:'pm.yan',date:'2026-10-09',title:'會議紀錄全部交俾 AI',replies:120},
 {id:'J',handle:'it.sec',date:'2026-10-12',title:'IT 部：偷偷用 AI 係資料外洩風險',replies:265},
 {id:'K',handle:'teacher.c',date:'2026-10-16',title:'學校老師用 AI 出卷',replies:180,pending:true},
 {id:'L',handle:'cs_lok',date:'2026-10-18',title:'客服仲有冇得做？',replies:230,pending:true}
];
const points=[
 {id:'private',label:'員工私下用 AI，公司政策有鬆有緊',short:'私下使用與公司政策',hits:{A:'公司 IT 封咗網址，我哋用手機開。',F:'老闆唔知我用 AI 對數，快咗兩粒鐘。',I:'冇人講過可唔可以，大家就照用。',D:'我哋 HR 都未有政策，係最近先開始傾。'}},
 {id:'privacy',label:'資料保密是禁用或收緊使用的原因',short:'資料保密的限制',hits:{G:'客戶資料一入 AI 就係違約，所以全面禁。',J:'上個月有同事將合約貼入去，即刻要報告。',A:'我哋公司都係因為呢個原因封網。'}},
 {id:'writing',label:'AI 已用於電郵、會議紀錄與工作文件',short:'電郵、紀錄與文件',hits:{I:'每次開完會錄音丟入去，十分鐘有紀錄。',A:'寫 email 俾老闆用嚟潤色。',B:'寫 commit message 同文件。',F:'用嚟寫對數報告嘅說明。'}},
 {id:'jobs',label:'職位取代的壓力，出現在裁員、求職與技能要求',short:'職位與技能壓力',hits:{C:'我哋組由 12 個減到 6 個。',H:'見工時人哋話「呢啲 AI 做得到」。',E:'驚嘅唔係設計師，係只識跟稿嗰啲。'}},
 {id:'review',label:'程式與設計使用 AI 後，仍需人工檢查和修改',short:'初稿之後的人工工作',hits:{B:'快咗，但 review 時間多咗。',E:'我用 AI 出初稿，之後自己改。'}}
];

const byId=new Map(posts.map(p=>[p.id,p]));
const included=posts.filter(p=>!p.pending);
const pointById=new Map(points.map(p=>[p.id,p]));
const refCount=points.reduce((n,p)=>n+Object.keys(p.hits).length,0);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateLabel=d=>`${Number(d.slice(5,7))}月${Number(d.slice(8))}日`;
const state={point:'writing',trays:new Map(),selected:[],gathered:false,highlight:null,reader:null,returnFocus:null,notice:'',newId:null};
const app=document.getElementById('app');
if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embed');
function current(){return pointById.get(state.point)}
function sourceIds(){return Object.keys(current().hits)}
function tray(){if(!state.trays.has(state.point))state.trays.set(state.point,sourceIds().slice(0,2));return state.trays.get(state.point)}
function setTray(ids){state.trays.set(state.point,ids)}
function sourceCard(id){const p=byId.get(id),onDesk=tray().includes(id);return `<article class="source${state.highlight===id?' highlight':''}" data-source="${id}"><button class="source-title" data-action="reader" data-id="${id}" data-focus="source-${id}" aria-label="查看來源帖：${esc(p.title)}">${esc(p.title)}</button><div class="source-bottom"><span>${dateLabel(p.date)}</span><button data-action="${onDesk?'locate':'extract'}" data-id="${id}" data-focus="extract-${id}" class="${onDesk?'on-desk':''}">${onDesk?'桌上定位 ↓':'抽出原句 ↓'}</button></div></article>`}
function slipCard(id){const p=byId.get(id),selected=state.selected.includes(id);return `<article class="slip${selected?' selected':''}${state.highlight===id?' highlight':''}${state.newId===id?' new':''}" data-slip="${id}"><div class="slip-top"><button class="slip-source" data-action="reader" data-id="${id}" data-focus="slip-source-${id}" aria-label="查看來源帖：${esc(p.title)}">來源帖 @${esc(p.handle)}<b>${esc(p.title)} ↗</b></button><button class="select-slip" data-action="select" data-id="${id}" data-focus="select-${id}" aria-pressed="${selected}" aria-label="${selected?'取消選取':'選取'}節錄：${esc(p.title)}">${selected?'✓':'＋'}</button></div><blockquote>${esc(current().hits[id])}</blockquote><div class="slip-footer"><small>留言節錄 · 作者未提供</small><button data-action="return" data-id="${id}" data-focus="return-${id}" aria-label="收回節錄：${esc(p.title)}">收回 ↑</button></div></article>`}
function deskMarkup(){const ids=tray(),selected=ids.filter(id=>state.selected.includes(id)),others=ids.filter(id=>!state.selected.includes(id));return `<section class="desk" aria-label="原句桌面"><div class="desk-header"><h3>原句桌面</h3><span>${ids.length} / ${sourceIds().length} 則已抽出</span></div><p class="desk-hint">選取節錄後聚攏；點帖題可查看來源。</p><div class="desk-tools"><span class="selection-count">${selected.length?`已選 ${selected.length} 則`:'還未選取'}</span><button class="gather" data-action="gather" data-focus="gather" ${selected.length<2?'disabled':''} aria-pressed="${state.gathered}">${state.gathered?'散開節錄':'聚攏比較'}</button><button data-action="clear" data-focus="clear" ${!selected.length?'disabled':''}>清除選取</button></div>${ids.length?(state.gathered?`<div class="bundle"><p class="bundle-title">一起讀 · ${selected.length} 則，來自 ${selected.length} 篇帖</p><div class="slips">${selected.map(slipCard).join('')}</div></div>${others.length?`<p class="outside-label">留在桌面的其他節錄</p><div class="slips">${others.map(slipCard).join('')}</div>`:''}`:`<div class="slips">${ids.map(slipCard).join('')}</div>`):'<div class="empty">桌面暫時空白。<br>從上方來源按「抽出原句」。</div>'}<p class="status" role="status" aria-live="polite">${esc(state.notice)}</p></section>`}
function readerMarkup(){if(!state.reader)return '';const p=byId.get(state.reader),refs=points.filter(point=>Object.hasOwn(point.hits,p.id));return `<div class="reader"><section class="reader-card" role="dialog" aria-modal="true" aria-labelledby="reader-title"><header class="reader-head"><span>已存來源 · ${refs.length} 則引用</span><button data-action="close-reader" data-focus="close-reader">關閉 ×</button></header><h3 id="reader-title">${esc(p.title)}</h3><p class="reader-meta">來源帖 @${esc(p.handle)} · ${dateLabel(p.date)}</p>${refs.map(point=>`<div class="reader-quote${point.id===state.point?' current':''}"><p>${esc(point.short)}${point.id===state.point?' · 目前重點':''}</p><blockquote>${esc(point.hits[p.id])}</blockquote><small>留言節錄 · 作者未提供</small>${point.id===state.point?`<br><button class="back-to-slip" data-action="back-to-slip" data-id="${p.id}" data-focus="back-to-slip">${tray().includes(p.id)?'回桌面定位這句 ↓':'抽出這句到桌面 ↓'}</button>`:''}</div>`).join('')}<p class="reader-boundary">虛構來源只提供上述節錄，沒有完整帖文或原站網址。</p></section></div>`}
function render(focusKey,scrollTarget){const top=app.scrollTop;app.innerHTML=`<div class="workspace-content"${state.reader?' inert':''}><div class="chrome"><span>DLens</span><small>工作區</small></div><div class="nav"><span>收藏</span><b>工作區</b></div><header class="topic"><p class="crumb">觀眾反應 / 話題</p><h2>返工用 AI 工具</h2><p class="coverage">${included.length} / ${posts.length} 篇已納入 · ${posts.length-included.length} 篇待預讀 · ${refCount} 則引用</p></header><div class="point-picker"><label for="point-select">選一個重點<span>${points.length} 個重點</span></label><select id="point-select" data-focus="point-select">${points.map(p=>`<option value="${p.id}"${p.id===state.point?' selected':''}>${esc(p.short)} · ${Object.keys(p.hits).length} 篇</option>`).join('')}</select></div><section class="shelf" aria-label="本重點引用的來源帖"><p class="section-label"><strong>來源帖</strong><span>這個重點引用 ${sourceIds().length} 篇</span></p><div class="source-grid">${sourceIds().map(sourceCard).join('')}</div></section>${deskMarkup()}<footer class="scope-note"><p>${esc(current().label)}</p><p>引用只代表這個重點使用了這篇帖；不代表立場相同。全部內容為虛構示意。</p></footer></div>${readerMarkup()}`;app.scrollTop=state.reader?0:top;if(focusKey)app.querySelector(`[data-focus="${CSS.escape(focusKey)}"]`)?.focus({preventScroll:true});if(scrollTarget)app.querySelector(scrollTarget)?.scrollIntoView({block:'nearest',behavior:'instant'});state.newId=null;}
app.addEventListener('change',e=>{if(e.target.id!=='point-select')return;state.point=e.target.value;state.selected=[];state.gathered=false;state.highlight=null;state.notice='';render('point-select');});
app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const id=b.dataset.id;let focus=b.dataset.focus,scrollTarget;switch(b.dataset.action){
case'extract':if(!tray().includes(id))setTray([...tray(),id]);state.highlight=id;state.newId=id;state.notice=`已抽出「${byId.get(id).title}」的原句。`;focus=`select-${id}`;scrollTarget=`[data-slip="${id}"]`;break;
case'locate':state.highlight=id;state.notice='來源與桌上原句已一併標示。';focus=`slip-source-${id}`;scrollTarget=`[data-slip="${id}"]`;break;
case'select':state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];if(state.selected.length<2)state.gathered=false;state.highlight=null;state.notice=state.selected.length<2?'再選一則，可聚攏一起讀。':`已選 ${state.selected.length} 則，可以聚攏比較。`;break;
case'gather':if(state.selected.length<2)return;state.gathered=!state.gathered;state.highlight=null;state.notice=state.gathered?'已把選取的原句放在一起，來源連結仍保留。':'節錄已散開，選取仍保留。';break;
case'clear':state.selected=[];state.gathered=false;state.highlight=null;state.notice='已清除選取，原句留在桌面。';focus=tray().length?`select-${tray()[0]}`:'point-select';break;
case'return':setTray(tray().filter(x=>x!==id));state.selected=state.selected.filter(x=>x!==id);if(state.selected.length<2)state.gathered=false;state.highlight=id;state.notice='節錄已收回來源，仍可再抽出。';focus=`extract-${id}`;scrollTarget=`[data-source="${id}"]`;break;
case'reader':state.returnFocus={key:focus,scroll:app.scrollTop};state.reader=id;state.highlight=id;focus='close-reader';break;
case'close-reader':state.reader=null;focus=state.returnFocus?.key||'point-select';break;
case'back-to-slip':state.reader=null;if(!tray().includes(id)){setTray([...tray(),id]);state.newId=id;}state.highlight=id;focus=`slip-source-${id}`;scrollTarget=`[data-slip="${id}"]`;state.notice='已定位這個來源的原句。';break;
}render(focus,scrollTarget);if(b.dataset.action==='close-reader')app.scrollTop=state.returnFocus?.scroll||0;});
app.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(state.reader){state.reader=null;render(state.returnFocus?.key||'point-select');app.scrollTop=state.returnFocus?.scroll||0;return;}if(state.gathered){state.gathered=false;state.notice='已散開，選取仍保留。';render('gather');return;}if(state.selected.length||state.highlight){const id=state.selected[0]||state.highlight;state.selected=[];state.highlight=null;state.notice='已清除選取。';render(tray().includes(id)?`select-${id}`:`source-${id}`);}return;}if(e.key==='Tab'&&state.reader){const controls=[...app.querySelector('.reader-card').querySelectorAll('button,a[href],select,[tabindex="0"]')];const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
