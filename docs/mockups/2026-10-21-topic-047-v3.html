const byId=new Map(posts.map(p=>[p.id,p]));
const included=posts.filter(p=>!p.pending);
const pointById=new Map(points.map(p=>[p.id,p]));

const dateLabel=d=>`${Number(d.slice(5,7))}月${Number(d.slice(8))}日`;
const base=['A','F','I'];
const state={a:{visible:[...base],selected:[],point:null,picker:false,draft:[],notice:''},b:{visible:[...base],selected:['F','I'],point:null,picker:false,draft:[],notice:''},c:{visible:[...base],selected:[],point:'writing',picker:false,draft:[],notice:''}};
function visiblePoints(s){
 const rank=p=>{const indices=s.visible.flatMap((id,i)=>Object.hasOwn(p.hits,id)?[i]:[]);return indices.reduce((a,b)=>a+b,0)/indices.length;};
 // Order once per visible post set, never by focus, so selecting nodes cannot move the map.
 return points.filter(p=>s.visible.some(id=>Object.hasOwn(p.hits,id))).sort((a,b)=>rank(a)-rank(b));
}
function commonPoints(ids){return ids.length?points.filter(p=>ids.every(id=>Object.hasOwn(p.hits,id))):[];}
function activePoints(s){return s.point?[pointById.get(s.point)]:commonPoints(s.selected);}
function graphModel(s){
 const shown=visiblePoints(s),focused=!!s.point||s.selected.length>0,active=new Set(activePoints(s).map(p=>p.id));
 const sourceIds=new Set(s.selected.length?s.selected:s.point?s.visible.filter(id=>Object.hasOwn(pointById.get(s.point).hits,id)):s.visible);
 return {shown,focused,active,sourceIds};
}
function graphMarkup(key,s){
 const m=graphModel(s);
 return `<div class="graph-labels"><span>帖子 · ${s.visible.length} 篇</span><span>被引用的重點</span></div><div class="graph" id="${key}-diagram"><svg class="wires" aria-hidden="true"></svg><div class="column post-column">${s.visible.map(id=>{
  const p=byId.get(id),selected=s.selected.includes(id),connected=m.focused&&m.sourceIds.has(id)&&m.shown.some(point=>m.active.has(point.id)&&Object.hasOwn(point.hits,id));
  const refs=m.shown.filter(point=>Object.hasOwn(point.hits,id)).map(point=>point.short).join('、');
  return `<button class="node post-node${selected?' selected':connected?' connected':m.focused?' dim':''}" data-action="post" data-id="${id}" data-node-post="${id}" data-focus="post-${id}" aria-pressed="${selected}" aria-label="${esc(p.title)}，@${esc(p.handle)}；被${esc(refs)}引用">${selected?'<span class="selected-mark" aria-hidden="true">已選</span>':''}<span class="node-title">${esc(p.title)}</span><span class="node-meta">@${esc(p.handle)}<br>${dateLabel(p.date)}</span></button>`;
 }).join('')}</div><div class="column point-column">${m.shown.map(p=>{
  const connected=m.active.has(p.id),count=s.visible.filter(id=>Object.hasOwn(p.hits,id)).length;
  return `<button class="node point-node${s.point===p.id?' selected':m.focused&&connected?' connected':m.focused?' dim':''}" data-action="point" data-id="${p.id}" data-node-point="${p.id}" data-focus="point-${p.id}" aria-pressed="${s.point===p.id}" aria-label="${esc(p.short)}，圖中 ${count} 篇來源，全部 ${Object.keys(p.hits).length} 篇來源"><span class="node-title">${esc(p.short)}</span><span class="node-meta">圖中 ${count} 篇</span></button>`;
 }).join('')}</div></div><div class="selection-bar"><span>${s.selected.length?`已選 ${s.selected.length} 篇${s.selected.length===1?' · 再選一篇找交集':''}`:s.point?'已選一個引用重點':'點兩篇找交集，也可直接點重點'}</span>${m.focused?'<button data-action="clear" data-focus="clear">清除選取</button>':''}</div><p class="legend"><i aria-hidden="true"></i><span>線＝重點引用這篇帖 · 數字只計圖中來源</span></p>`;
}
function quoteCard(point,id){const p=byId.get(id);return `<article class="quote-card"><header><span>來源帖 @${esc(p.handle)}</span><time datetime="${p.date}">${dateLabel(p.date)}</time></header><p class="post-title">${esc(p.title)}</p><blockquote>${esc(point.hits[id])}</blockquote><small>留言節錄 · 作者未提供</small></article>`;}
function pointOptions(ps){return `<div class="common-links">${ps.map(p=>`<button data-action="point" data-id="${p.id}" data-focus="option-${p.id}">${esc(p.short)} ↗</button>`).join('')}</div>`;}
function detailMarkup(s){
 if(s.point){const p=pointById.get(s.point),shown=s.visible.filter(id=>Object.hasOwn(p.hits,id)),quoted=s.selected.length?shown.filter(id=>s.selected.includes(id)):shown;
  return `<section class="detail" aria-label="引用原句"><h3>${esc(p.label)}</h3><p class="subtitle">此重點共引用 ${Object.keys(p.hits).length} 篇 · 圖中 ${shown.length} 篇${s.selected.length?` · 以下顯示已選的 ${quoted.length} 篇`:''}</p>${quoted.length?`<div class="quotes">${quoted.map(id=>quoteCard(p,id)).join('')}</div>`:'<p class="empty">已選帖子沒有被這個重點引用。可以選另一個重點。</p>'}</section>`;
 }
 if(s.selected.length===2){const common=commonPoints(s.selected);return `<section class="detail" aria-label="共同引用結果"><h3>${common.length?`${common.length} 個共同引用重點`:'這兩篇沒有共同引用重點'}</h3><p class="subtitle">@${esc(byId.get(s.selected[0]).handle)} 與 @${esc(byId.get(s.selected[1]).handle)}</p>${common.length?pointOptions(common):'<p class="empty">這只描述本次解讀的引用；兩帖內容仍可能相關。</p>'}</section>`;}
 if(s.selected.length===1){const p=byId.get(s.selected[0]),refs=commonPoints(s.selected);return `<section class="detail"><h3>${esc(p.title)}</h3><p class="subtitle">被 ${refs.length} 個重點引用。再點一篇，圖上會突出共同引用。</p>${pointOptions(refs)}</section>`;}

 return `<section class="detail" aria-label="圖中關係摘要"><h3>${common.length?`這 ${s.visible.length} 篇共同連到 ${common.length} 個重點`:'這組帖子有不同的引用去向'}</h3><p class="subtitle">${common.length?'沿線能看見同一重點使用了哪些帖子。':'點兩篇，查看它們有沒有共同被引用。'}</p>${pointOptions(common)}</section>`;

function pickerMarkup(s){if(!s.picker)return '';return `<section class="picker" aria-label="選擇比較帖子"><p>同時比較 2–4 篇，保留帖題和連線的閱讀空間。</p><div class="preset-row"><button data-action="preset" data-set="policy" data-focus="preset-policy">政策與文書</button><button data-action="preset" data-set="work" data-focus="preset-work">工作與技能</button></div><div class="picker-list">${included.map(p=>`<label><input type="checkbox" data-pick="${p.id}" data-focus="pick-${p.id}" ${s.draft.includes(p.id)?'checked':''}><span>${esc(p.title)}<small>@${esc(p.handle)} · ${dateLabel(p.date)}</small></span></label>`).join('')}</div><p class="notice" role="status">${esc(s.notice||`已選 ${s.draft.length} 篇`)}</p><div class="picker-actions"><button data-action="cancel-picker" data-focus="cancel-picker">取消</button><button class="apply" data-action="apply-picker" data-focus="apply-picker" ${s.draft.length<2||s.draft.length>4?'disabled':''}>套用 ${s.draft.length} 篇</button></div></section>`;}
const observers=new Map();
function draw(key){

 svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);
 svg.innerHTML=s.visible.flatMap(id=>m.shown.filter(p=>Object.hasOwn(p.hits,id)).map(p=>{
  const a=graph.querySelector(`[data-node-post="${id}"]`).getBoundingClientRect(),b=graph.querySelector(`[data-node-point="${p.id}"]`).getBoundingClientRect();
  const x1=a.right-r.left,y1=a.top+a.height/2-r.top,x2=b.left-r.left,y2=b.top+b.height/2-r.top,gap=x2-x1;
  const active=m.focused&&m.active.has(p.id)&&m.sourceIds.has(id);
  return `<path data-edge="${id}:${p.id}" class="${active?'active':m.focused?'dim':''}" d="M ${x1} ${y1} C ${x1+gap*.48} ${y1}, ${x2-gap*.48} ${y2}, ${x2} ${y2}"></path>`;
 })).join('');
}
function render(key,focusKey){
 const s=state[key],root=document.getElementById(`graph-${key}`),top=root.scrollTop;
 observers.get(key)?.disconnect();
 root.innerHTML=`<div class="chrome"><span>DLens</span><small>側欄</small></div><div class="nav"><span>收藏</span><b>工作區</b></div><div class="body"><p class="crumb">觀眾反應 / 話題</p><h2>返工用 AI 工具</h2><p class="topic-coverage">本次解讀 ${included.length} / ${posts.length} 篇 · ${posts.length-included.length} 篇待預讀</p><div class="module-title"><b>跨帖引用</b><button class="quiet" data-action="picker" data-focus="picker" aria-expanded="${s.picker}">${s.picker?'收起選帖':'換帖'}</button></div><p class="scope">顯示 ${s.visible.length} / ${included.length} 篇已解讀帖子</p>${pickerMarkup(s)}${graphMarkup(key,s)}${detailMarkup(s)}</div>`;
 root.scrollTop=top;draw(key);
 const ro=new ResizeObserver(()=>draw(key));ro.observe(root.querySelector('.graph'));observers.set(key,ro);
 if(focusKey)root.querySelector(`[data-focus="${CSS.escape(focusKey)}"]`)?.focus({preventScroll:true});
}
for(const key of Object.keys(state)){
 const root=document.getElementById(`graph-${key}`),s=state[key];
 root.addEventListener('click',e=>{
  const b=e.target.closest('button[data-action]');if(!b)return;let focus=b.dataset.focus;
  switch(b.dataset.action){
   case'post':s.point=null;s.selected=s.selected.includes(b.dataset.id)?s.selected.filter(id=>id!==b.dataset.id):[...s.selected.slice(-1),b.dataset.id];break;
   case'point':
    // A graph node explores every visible source; a common-point chip keeps the chosen pair.
    if(b.hasAttribute('data-node-point'))s.selected=[];
    s.point=s.point===b.dataset.id?null:b.dataset.id;
    focus=`point-${b.dataset.id}`;
    break;
   case'clear':s.selected=[];s.point=null;focus=`post-${s.visible[0]}`;break;
   case'picker':s.picker=!s.picker;s.draft=[...s.visible];s.notice='';break;
   case'cancel-picker':s.picker=false;focus='picker';break;
   case'preset':s.draft=b.dataset.set==='policy'?['A','F','I']:['B','E','H','C'];s.notice='';break;
   case'apply-picker':if(s.draft.length<2||s.draft.length>4)return;s.visible=posts.filter(p=>s.draft.includes(p.id)).map(p=>p.id);s.selected=[];s.point=null;s.picker=false;focus='picker';break;
  }
  render(key,focus);
 });
 root.addEventListener('change',e=>{
  const input=e.target.closest('input[data-pick]');if(!input)return;
  if(input.checked&&s.draft.length>=4){input.checked=false;s.notice='已選 4 篇，先取消一篇再加入。';}
  else{s.draft=input.checked?[...s.draft,input.dataset.pick]:s.draft.filter(id=>id!==input.dataset.pick);s.notice='';}
  const list=root.querySelector('.picker-list'),scroll=list?.scrollTop??0;render(key,`pick-${input.dataset.pick}`);root.querySelector('.picker-list').scrollTop=scroll;
 });
 root.addEventListener('keydown',e=>{if(e.key!=='Escape')return;e.preventDefault();if(s.picker){s.picker=false;render(key,'picker');}else if(s.point){const id=s.point;s.point=null;render(key,`point-${id}`);}else if(s.selected.length){const id=s.selected[0];s.selected=[];render(key,`post-${id}`);}});
 render(key);
}
</script>
</body>
